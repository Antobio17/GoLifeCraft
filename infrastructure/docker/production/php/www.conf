[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data

; Dynamic process management for production (better resource usage)
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 1000

request_terminate_timeout = 60
catch_workers_output = yes
decorate_workers_output = no

; Log slow requests with a PHP backtrace. Threshold sits above the heaviest
; normal request (~1.1s on the catalog sync) so it only fires on degradation.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 2s

; Access log disabled: one line per request drowns the error stream and burns
; the container log rotation. Slow requests are still captured by slowlog and
; non-2xx responses by the nginx access log.
access.log = /dev/null
