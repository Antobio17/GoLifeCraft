server_tokens off;

server {
    listen 80;
    server_name golifecraft.com www.golifecraft.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name golifecraft.com www.golifecraft.com;

    ssl_certificate /etc/letsencrypt/live/golifecraft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/golifecraft.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/golifecraft.com/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 9.9.9.9 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://prod-mercadona.imgix.net https://images.openfoodfacts.org; media-src 'self' blob:; object-src 'self' blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; report-uri /api/v1/csp-report" always;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 100M;
        # El alta de artículo desde fotos habla con Gemini dentro de la petición:
        # el techo se sube a 120 s para que el proxy no corte antes que la
        # aplicación, que falla sola a los 45 s (GEMINI_TIMEOUT).
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }

    # Grafana. The upstream goes through a variable on purpose: with a literal
    # hostname nginx resolves it at config load, so a missing or stopped
    # Grafana would stop the whole gateway from booting and take the site down.
    # With a variable it resolves per request and only /grafana/ returns 502.
    # $request_uri keeps the /grafana prefix, which serve_from_sub_path needs
    # to emit the right <base href>.
    # The add_header below is deliberate: defining any add_header here drops
    # every header inherited from the server block, keeping the app's
    # Content-Security-Policy-Report-Only away from Grafana's inline assets.
    location /grafana/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $grafana_upstream grafana;
        proxy_pass http://$grafana_upstream:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;

        # Grafana OSS cannot rebrand its logo or add nav links (that is
        # Enterprise white-labeling), so the way back to the app is injected
        # here. It is a plain anchor with an inline style: Grafana's CSP allows
        # 'unsafe-inline' for style-src but nonces every script, so anything
        # relying on JS would be blocked. target="_self" is what makes the click
        # work: interceptLinkClicks swallows every same-origin anchor that has
        # no target and pushes it into Grafana's own router, so without it the
        # button does nothing. Accept-Encoding is cleared because sub_filter
        # cannot rewrite a compressed body.
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        # Match the current brand mark and dark-theme primary/on-primary tokens.
        # Inline SVG keeps the icon independent of asset paths and image CSP.
        sub_filter '</body>' '<a href="/" target="_self" aria-label="Volver a GoLifeCraft" title="Volver a GoLifeCraft" style="position:fixed;z-index:2147483647;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;box-sizing:border-box;border-radius:15px;background:#8ffa98;color:#001907;border:1px solid rgba(0,25,7,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 10px 22px -8px rgba(0,0,0,.85);text-decoration:none"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="30" height="30" fill="none" aria-hidden="true" focusable="false"><path d="M50 21 A29 29 0 1 0 79 50 L63 50" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 43 C54 32 62 25 73 25 C73 36 65 43 54 43 Z" fill="currentColor"/></svg></a></body>';

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Article and recipe photos. They live on the backend nginx, which serves
    # /var/www/upload straight from disk, so they must not fall through to the
    # Angular container the way the rest of / does.
    location /upload/ {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(_mcp|oauth|\.well-known/oauth) {
        client_max_body_size 100M;
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }
}
