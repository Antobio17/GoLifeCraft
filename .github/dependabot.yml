version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /infrastructure/docker/*/*
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      base-images:
        patterns:
          - "*"
    commit-message:
      prefix: build(docker)
