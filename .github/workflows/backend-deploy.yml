name: 🚀 Backend · Deploy to Production (SSH)

on:
  workflow_run:
    workflows: ["🐳 Backend · Publish images (GHCR)"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/golifecraft

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: ${{ secrets.SERVER_PROJECT_PATH }}

      # Docker creates a directory when a bind-mount source is missing, and then
      # refuses to mount a file over it. Clear those out before copying, or the
      # scp below would drop the config *inside* the stray directory.
      - name: Clear stray bind-mount directories
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.SERVER_PROJECT_PATH }}
            for path in \
              infrastructure/docker/production/certbot/entrypoint.sh \
              infrastructure/docker/production/loki/loki-config.yaml \
              infrastructure/docker/production/alloy/config.alloy; do
              if [ -d "$path" ]; then
                echo "==> Removing stray directory $path"
                rmdir "$path" 2>/dev/null || rm -rf "$path"
              fi
            done

      # Every path the compose file bind-mounts from ./infrastructure must be
      # copied here. Anything missing gets auto-created by Docker as a
      # directory and the container fails to start.
      - name: Copy bind-mounted configs to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: |
            infrastructure/docker/production/certbot
            infrastructure/docker/production/loki
            infrastructure/docker/production/alloy
            infrastructure/docker/production/grafana
          target: ${{ secrets.SERVER_PROJECT_PATH }}

      - name: Copy database schema to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: infrastructure/docker/production/mysql/schema.sql
          target: ${{ secrets.SERVER_PROJECT_PATH }}
          strip_components: 4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e

            echo "==> Bootstrapping project directory..."
            cd ${{ secrets.SERVER_PROJECT_PATH }}
            mkdir -p volumes/public_uploads volumes/internal_uploads volumes/jwt_keys

            echo "==> Writing .env.local from secrets..."
            cat > .env.local <<'GOLIFECRAFT_ENV_EOF'
            ${{ secrets.PROD_ENV_FILE }}
            GOLIFECRAFT_ENV_EOF
            chmod 600 .env.local

            echo "==> Logging in to GitHub Container Registry..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            echo "==> Pulling latest images..."
            docker compose --env-file .env.local -f docker-compose.prod.yml pull gateway nginx php loki alloy grafana dockerproxy

            echo "==> Starting services..."
            docker compose --env-file .env.local -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> Waiting for database to be ready..."
            DATABASE_MASTER_PASSWORD=$(grep '^DATABASE_MASTER_PASSWORD=' .env.local | cut -d= -f2-)
            tries=0
            until docker exec golifecraft_mysql mysqladmin ping -h127.0.0.1 -uroot -p"$DATABASE_MASTER_PASSWORD" --silent 2>/dev/null; do
              tries=$((tries + 1))
              if [ "$tries" -ge 30 ]; then
                echo "::error::Database did not become ready in time"
                exit 1
              fi
              sleep 2
            done

            echo "==> Ensuring database schemas exist (master and tenants)..."
            docker exec -i golifecraft_mysql mysql -uroot -p"$DATABASE_MASTER_PASSWORD" < schema.sql
            rm -f schema.sql

            echo "==> Fixing ownership of mounted volumes for www-data..."
            docker exec -u root golifecraft_php sh -lc 'chown -R www-data:www-data /var/www/html/config/jwt /var/www/html/var/uploads'

            echo "==> Generating JWT keypair if missing..."
            docker exec golifecraft_php sh -lc 'php bin/console lexik:jwt:generate-keypair --skip-if-exists'

            echo "==> Updating database schema on server (master and tenant)..."
            docker exec golifecraft_php sh -lc 'php bin/console doctrine:schema:update --dump-sql --force'
            docker exec golifecraft_php sh -lc 'php bin/console app:tenant:schema-update --dump-sql --force'

            echo "==> Normalizing database collation (master and tenants)..."
            docker exec golifecraft_php sh -lc 'php bin/console app:db:fix-collation --force'

            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> Deploy completed successfully!"

      - name: Deployment status
        if: failure()
        run: echo "::error::Deployment to production server failed!"
