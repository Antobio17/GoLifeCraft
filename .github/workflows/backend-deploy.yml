name: 🚀 Backend · Deploy to Production (SSH)

on:
  workflow_run:
    workflows: ["🐳 Backend · Publish images (GHCR)"]
    types:
      - completed
    branches:
      - master
  # The config below is bind-mounted, not baked into an image, so a change to it
  # never triggers a build and would otherwise sit in the repo without reaching
  # the server until the next unrelated backend deploy.
  push:
    branches:
      - master
    paths:
      - 'docker-compose.prod.yml'
      - 'infrastructure/docker/production/certbot/**'
      - 'infrastructure/docker/production/loki/**'
      - 'infrastructure/docker/production/alloy/**'
      - 'infrastructure/docker/production/grafana/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/golifecraft

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: ${{ secrets.SERVER_PROJECT_PATH }}

      # Docker creates any missing bind-mount source as a root-owned directory,
      # which then breaks both the mount and the scp below (the deploy user
      # cannot delete or write into root-owned paths). Wipe the config tree and
      # hand it back to the deploy user. Done inside a container because that
      # is the only way to act as root here without sudo.
      - name: Reset config tree ownership on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.SERVER_PROJECT_PATH }}
            # A container that is restarting while its bind-mount source is gone
            # makes Docker recreate that source as a root-owned directory, which
            # then blocks the scp below. Stopping them first closes that window;
            # the deploy starts them again with the fresh config mounted.
            docker stop golifecraft_certbot golifecraft_loki golifecraft_alloy golifecraft_grafana >/dev/null 2>&1 || true
            docker run --rm -v "$(pwd):/w" -w /w alpine:latest sh -c '
              rm -rf infrastructure/docker/production/certbot \
                     infrastructure/docker/production/loki \
                     infrastructure/docker/production/alloy \
                     infrastructure/docker/production/grafana
              mkdir -p infrastructure/docker/production
              chown -R '"$(id -u):$(id -g)"' infrastructure
            '

      # Every path the compose file bind-mounts from ./infrastructure must be
      # copied here. Anything missing gets auto-created by Docker as a
      # directory and the container fails to start.
      - name: Copy bind-mounted configs to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: "infrastructure/docker/production/certbot,infrastructure/docker/production/loki,infrastructure/docker/production/alloy,infrastructure/docker/production/grafana"
          target: ${{ secrets.SERVER_PROJECT_PATH }}

      - name: Copy database schema to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: infrastructure/docker/production/mysql/schema.sql
          target: ${{ secrets.SERVER_PROJECT_PATH }}
          strip_components: 4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e

            echo "==> Bootstrapping project directory..."
            cd ${{ secrets.SERVER_PROJECT_PATH }}
            mkdir -p volumes/public_uploads volumes/internal_uploads volumes/jwt_keys

            echo "==> Writing .env.local from secrets..."
            cat > .env.local <<'GOLIFECRAFT_ENV_EOF'
            ${{ secrets.PROD_ENV_FILE }}
            GOLIFECRAFT_ENV_EOF
            chmod 600 .env.local

            echo "==> Logging in to GitHub Container Registry..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            echo "==> Pulling latest images..."
            docker compose --env-file .env.local -f docker-compose.prod.yml pull gateway nginx php loki alloy grafana dockerproxy

            echo "==> Starting services..."
            docker compose --env-file .env.local -f docker-compose.prod.yml up -d --remove-orphans

            # certbot, loki, alloy and grafana take their config from bind mounts
            # that this deploy wipes and rewrites, and they read it only at boot.
            # They used to be restarted here to re-resolve the mount; that is no
            # longer needed because the deploy now stops them before the wipe, so
            # the up -d above already started them with the new files.

            # Grafana exits with code 1 on any invalid provisioning file and,
            # with restart: always, spends forever in a restart loop that no
            # other step notices. Fail the deploy instead of shipping a dead
            # observability stack: a container still young after the wait is one
            # that keeps dying and being restarted.
            echo "==> Verifying Grafana came up..."
            sleep 25
            grafana_status=$(docker inspect -f '{{.State.Status}}' golifecraft_grafana 2>/dev/null || echo missing)
            grafana_started=$(docker inspect -f '{{.State.StartedAt}}' golifecraft_grafana 2>/dev/null || echo "$(date -u +%FT%TZ)")
            grafana_uptime=$(( $(date -u +%s) - $(date -u -d "$grafana_started" +%s) ))
            if [ "$grafana_status" != "running" ] || [ "$grafana_uptime" -lt 15 ]; then
              docker logs --tail 40 golifecraft_grafana 2>&1 || true
              echo "::error::Grafana is not healthy (status=$grafana_status, uptime=${grafana_uptime}s)"
              exit 1
            fi

            echo "==> Waiting for database to be ready..."
            DATABASE_MASTER_PASSWORD=$(grep '^DATABASE_MASTER_PASSWORD=' .env.local | cut -d= -f2-)
            tries=0
            until docker exec golifecraft_mysql mysqladmin ping -h127.0.0.1 -uroot -p"$DATABASE_MASTER_PASSWORD" --silent 2>/dev/null; do
              tries=$((tries + 1))
              if [ "$tries" -ge 30 ]; then
                echo "::error::Database did not become ready in time"
                exit 1
              fi
              sleep 2
            done

            echo "==> Ensuring database schemas exist (master and tenants)..."
            docker exec -i golifecraft_mysql mysql -uroot -p"$DATABASE_MASTER_PASSWORD" < schema.sql
            rm -f schema.sql

            echo "==> Fixing ownership of mounted volumes for www-data..."
            docker exec -u root golifecraft_php sh -lc 'chown -R www-data:www-data /var/www/html/config/jwt /var/www/html/var/uploads'

            echo "==> Generating JWT keypair if missing..."
            docker exec golifecraft_php sh -lc 'php bin/console lexik:jwt:generate-keypair --skip-if-exists'

            echo "==> Updating database schema on server (master and tenant)..."
            docker exec golifecraft_php sh -lc 'php bin/console doctrine:schema:update --dump-sql --force'
            docker exec golifecraft_php sh -lc 'php bin/console app:tenant:schema-update --dump-sql --force'

            echo "==> Normalizing database collation (master and tenants)..."
            docker exec golifecraft_php sh -lc 'php bin/console app:db:fix-collation --force'

            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> Deploy completed successfully!"

      # An explicitly stopped container is not resurrected by restart: always,
      # so a deploy that dies between the stop above and the up -d would leave
      # the observability stack and certbot down until someone noticed. Bring
      # them back with whatever config is on disk; the job still fails.
      - name: Restart stopped services after a failed deploy
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.SERVER_PROJECT_PATH }}
            docker compose --env-file .env.local -f docker-compose.prod.yml up -d certbot loki alloy grafana || true

      - name: Deployment status
        if: failure()
        run: echo "::error::Deployment to production server failed!"
