name: 🩹 Backend · Restore children lost to the image bug

# One-off repair, kept off the deploy on purpose: a data fix does not belong in the path
# that every merge to master takes. Run it by hand from the Actions tab, read the dry run,
# then run it again with apply. The command never overwrites rows that are already there,
# so a second run is a no-op.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the rows back. Leave unchecked for a dry run that only reports.'
        type: boolean
        required: false
        default: false
      tenant:
        description: 'Single tenant database to repair. Leave empty for every GLC% tenant.'
        type: string
        required: false
        default: ''

jobs:
  restore:
    name: ${{ inputs.apply && 'Apply' || 'Dry run' }}
    runs-on: ubuntu-latest

    steps:
      - name: Run the restore command on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.SERVER_PROJECT_PATH }}

            ARGS=""
            if [ -n "${{ inputs.tenant }}" ]; then
              ARGS="$ARGS --tenant=${{ inputs.tenant }}"
            fi
            if [ "${{ inputs.apply }}" = "true" ]; then
              ARGS="$ARGS --force"
              echo "==> Applying the restore. Rows will be written."
            else
              echo "==> Dry run. Nothing will be written."
            fi

            docker exec golifecraft_php sh -lc "php bin/console app:catalog:restore-lost-children $ARGS"

      - name: Restore status
        if: failure()
        run: echo "::error::The restore command failed. Nothing partial was left behind if it failed before --force."
