services:
  gateway:
    image: ghcr.io/antobio17/golifecraft-gateway-production:latest
    container_name: golifecraft_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      CERT_DOMAIN: ${CERT_DOMAIN:-golifecraft.com}
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - nginx
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  certbot:
    image: certbot/certbot
    container_name: golifecraft_certbot
    depends_on:
      - gateway
    environment:
      CERT_DOMAIN: ${CERT_DOMAIN:-golifecraft.com}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-0}
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./infrastructure/docker/production/certbot/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  frontend:
    image: ghcr.io/antobio17/golifecraft-frontend-production:latest
    container_name: golifecraft_frontend
    restart: always
    ports:
      - "4200:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  nginx:
    image: ghcr.io/antobio17/golifecraft-nginx-production:latest
    container_name: golifecraft_nginx
    restart: always
    volumes:
      - ./volumes/public_uploads:/var/www/upload/
    ports:
      - "8083:80"
    depends_on:
      - php
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  php:
    image: ghcr.io/antobio17/golifecraft-php-production:latest
    container_name: golifecraft_php
    restart: always
    env_file:
      - .env.local
    volumes:
      - ./volumes/internal_uploads:/var/www/html/var/uploads
      - ./volumes/public_uploads:/var/www/html/public/upload
      - ./volumes/jwt_keys:/var/www/html/config/jwt
    depends_on:
      - db
      - postfix
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.50'
          memory: 256M

  worker:
    image: ghcr.io/antobio17/golifecraft-php-production:latest
    container_name: golifecraft_worker
    profiles:
      - tools
    env_file:
      - .env.local
    volumes:
      - ./volumes/worker_logs:/var/log/worker
      - ./volumes/mercadona:/var/www/html/var/mercadona
    depends_on:
      - db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  postfix:
    image: boky/postfix:latest
    container_name: golifecraft_postfix
    restart: always
    environment:
      ALLOWED_SENDER_DOMAINS: "${MAIL_DOMAIN:-golifecraft.com}"
      HOSTNAME: "mail.${MAIL_DOMAIN:-golifecraft.com}"
      POSTFIX_smtp_tls_security_level: "may"
      POSTFIX_smtpd_tls_security_level: "none"
      POSTFIX_mynetworks: "127.0.0.0/8,172.42.0.0/16"
      POSTFIX_inet_protocols: "ipv4"
      DKIM_AUTOGENERATE: "1"
    volumes:
      - ./volumes/postfix_dkim:/etc/opendkim/keys
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M

  loki:
    image: grafana/loki:3.7.6
    container_name: golifecraft_loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infrastructure/docker/production/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
        reservations:
          cpus: '0.10'
          memory: 128M

  # Only this container touches the Docker socket. Alloy talks to it over TCP
  # with just the read endpoints it needs, so a compromise of Alloy cannot
  # create containers or reach the host.
  dockerproxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: golifecraft_dockerproxy
    restart: always
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0
      EXEC: 0
      IMAGES: 0
      VOLUMES: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      NODES: 0
      SWARM: 0
      SYSTEM: 0
      INFO: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      DISTRIBUTION: 0
      PLUGINS: 0
      SESSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.10'
          memory: 32M

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: golifecraft_alloy
    restart: always
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infrastructure/docker/production/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
      - dockerproxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          cpus: '0.10'
          memory: 64M

  grafana:
    image: grafana/grafana:13.1.3
    container_name: golifecraft_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set in .env.local}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env.local}"
      GF_SERVER_ROOT_URL: "https://${CERT_DOMAIN:-golifecraft.com}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./infrastructure/docker/production/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  db:
    image: mysql:8.0.28
    container_name: golifecraft_mysql
    restart: always
    environment:
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: ${DATABASE_MASTER_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_MASTER_NAME:-master}
    ports:
      - "3309:3306"
    volumes:
      - /var/lib/golifecraft-mysql-docker:/var/lib/mysql
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.50'
          memory: 512M

volumes:
  certbot_certs:
  certbot_www:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  default:
    name: golifecraft_network
    ipam:
      config:
        - subnet: 172.42.0.0/16
