            delete_roles: [ROLE_GOD, ROLE_USER]

        # Read only on purpose: a stock count is history. Starting, counting and validating it
        # goes through the inventory commands, which are what overwrite the stock and leave the
        # trace behind; a client rewriting these rows would forge a count that never happened.
        inventory:
            class: 'Nutrition\Pantry\Inventory\Domain\Model\Inventory'
            sidecar: '%kernel.project_dir%/src/Nutrition/Pantry/Inventory/Infrastructure/Domain/Model/Doctrine/Mapping/Inventory.mcp.yaml'
