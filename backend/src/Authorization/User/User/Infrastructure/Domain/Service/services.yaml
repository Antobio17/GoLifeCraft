services:
    Authorization\User\User\Infrastructure\Domain\Service\Security\TenantUserProvider:
        class: Authorization\User\User\Infrastructure\Domain\Service\Security\TenantUserProvider
        arguments:
            - '@Authorization\User\User\Domain\Model\UserRepository'

    Authorization\User\User\Infrastructure\Domain\Service\Security\TenantUserAuthenticator:
        class: Authorization\User\User\Infrastructure\Domain\Service\Security\TenantUserAuthenticator
        arguments:
            - '@Symfony\Component\PasswordHasher\Hasher\UserPasswordHasherInterface'
            - '@Authorization\User\User\Infrastructure\Domain\Service\Security\TenantUserProvider'
            - '@Lexik\Bundle\JWTAuthenticationBundle\Services\JWTTokenManagerInterface'
            - '@Lexik\Bundle\JWTAuthenticationBundle\Encoder\JWTEncoderInterface'
            - '@Authorization\User\RefreshToken\Infrastructure\Domain\Service\RefreshTokenManager'
            - '%env(int:REFRESH_TOKEN_TTL_DAYS)%'

    Authorization\User\User\Infrastructure\Domain\Service\Security\TenantTokenAuthenticator:
        class: Authorization\User\User\Infrastructure\Domain\Service\Security\TenantTokenAuthenticator
        arguments:
            - '@Symfony\Component\PasswordHasher\Hasher\UserPasswordHasherInterface'
            - '@Authorization\User\User\Infrastructure\Domain\Service\Security\TenantUserProvider'
            - '@Lexik\Bundle\JWTAuthenticationBundle\Services\JWTTokenManagerInterface'
            - '@Lexik\Bundle\JWTAuthenticationBundle\Encoder\JWTEncoderInterface'

    Authorization\User\User\Domain\Service\PasswordHasher:
        class: Authorization\User\User\Infrastructure\Domain\Service\Security\SymfonyPasswordHasher
        arguments:
            - '@Symfony\Component\PasswordHasher\Hasher\UserPasswordHasherInterface'

    Authorization\User\User\Infrastructure\Domain\Service\Security\ActiveUserChecker:
        class: Authorization\User\User\Infrastructure\Domain\Service\Security\ActiveUserChecker

    Authorization\User\User\Domain\Service\ImpersonationTokenGenerator:
        class: Authorization\User\User\Infrastructure\Domain\Service\Security\LexikImpersonationTokenGenerator
        arguments:
            $userRepository: '@Authorization\User\User\Domain\Model\UserRepository'
            $jwtManager: '@Lexik\Bundle\JWTAuthenticationBundle\Services\JWTTokenManagerInterface'
            $dateTimeGenerator: '@Shared\Tool\Tool\Domain\Service\DateTimeGenerator'
            $ttlSeconds: '%env(int:IMPERSONATION_TOKEN_TTL_SECONDS)%'

    Authorization\User\User\Domain\Service\ImpersonationRevoker:
        class: Authorization\User\User\Infrastructure\Domain\Service\Security\CacheImpersonationRevoker
        arguments:
            $cache: '@cache.app'
            $ttlSeconds: '%env(int:IMPERSONATION_TOKEN_TTL_SECONDS)%'
