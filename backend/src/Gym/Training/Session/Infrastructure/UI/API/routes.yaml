create_session:
  path: /api/v1/gym/session
  methods: [POST]
  controller: Gym\Training\Session\Infrastructure\UI\API\Controller\CreateSessionController

delete_session:
  path: /api/v1/gym/session/{sessionId}
  methods: [DELETE]
  controller: Gym\Training\Session\Infrastructure\UI\API\Controller\DeleteSessionController

get_sessions:
  path: /api/v1/gym/sessions
  methods: [GET]
  controller: Gym\Training\Session\Infrastructure\UI\API\Controller\GetSessionsController

get_session:
  path: /api/v1/gym/session/{sessionId}
  methods: [GET]
  controller: Gym\Training\Session\Infrastructure\UI\API\Controller\GetSessionController

update_session_details:
  path: /api/v1/gym/session/{sessionId}/details
  methods: [PATCH]
  controller: Gym\Training\Session\Infrastructure\UI\API\Controller\UpdateSessionDetailsController

add_session_exercise:
  path: /api/v1/gym/session/{sessionId}/exercise/{sessionExerciseId}
  methods: [PUT]
  controller: Gym\Training\Session\Infrastructure\UI\API\Controller\AddSessionExerciseController

update_session_exercise:
  path: /api/v1/gym/session/{sessionId}/exercise/{sessionExerciseId}
  methods: [PATCH]
  controller: Gym\Training\Session\Infrastructure\UI\API\Controller\UpdateSessionExerciseController

reorder_session_exercises:
  path: /api/v1/gym/session/{sessionId}/exercises/order
  methods: [PATCH]
  controller: Gym\Training\Session\Infrastructure\UI\API\Controller\ReorderSessionExercisesController

remove_session_exercise:
  path: /api/v1/gym/session/{sessionId}/exercise/{sessionExerciseId}
  methods: [DELETE]
  controller: Gym\Training\Session\Infrastructure\UI\API\Controller\RemoveSessionExerciseController
