label: Exercise set

fields:
  sessionExerciseId:
    writable: true
    required: true
    min: 36
    max: 36
    filterable: true
  position:
    writable: true
    required: true
    type: int
    min: 1
    sortable: true
  reps:
    writable: true
    required: true
    type: int
    min: 0
  weight:
    writable: true
    type: float
    min: 0
  kind:
    writable: true
    enum: [warmup, effective]
    filterable: true
    description: >-
      Whether the set is a warmup ramp set or an effective working set. Only effective sets
      count towards volume and drive the weight progression.

relations: {}
