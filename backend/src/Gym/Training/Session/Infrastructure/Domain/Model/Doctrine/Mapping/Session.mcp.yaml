label: Training session

fields:
  name:
    writable: true
    required: true
    min: 2
    max: 255
    filterable: true
    sortable: true
  estimatedDurationMinutes:
    writable: true
    required: true
    type: int
    min: 0
    sortable: true
  restSeconds:
    writable: true
    required: false
    type: int
    min: 0
    max: 3600
    sortable: true
  progressionEnabled:
    writable: true
    type: bool
    filterable: true
    description: >-
      Whether the session writes weight predictions back to its exercises when a workout
      finishes. Turning it off keeps every exercise configuration untouched.

relations: {}

cascade_delete:
  - { resource: session_exercise, foreign_field: sessionId }
