label: Training session

fields:
  name:
    writable: true
    required: true
    min: 2
    max: 255
    filterable: true
    sortable: true
  estimatedDurationMinutes:
    writable: true
    required: true
    type: int
    min: 0
    sortable: true
  restSeconds:
    writable: true
    required: false
    type: int
    min: 0
    max: 3600
    sortable: true

relations: {}

cascade_delete:
  - { resource: session_exercise, foreign_field: sessionId }
