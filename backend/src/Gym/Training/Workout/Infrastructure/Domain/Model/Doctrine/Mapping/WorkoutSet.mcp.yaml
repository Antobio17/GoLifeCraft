label: Workout set

fields:
  workoutExerciseId:
    writable: true
    required: true
    min: 36
    max: 36
    description: Id of the workout exercise this set belongs to.
    filterable: true
  position:
    writable: true
    required: true
    type: int
    min: 1
    description: Order of the set inside the exercise, starting at 1.
    sortable: true
  reps:
    writable: true
    required: true
    type: int
    min: 0
    description: Repetitions actually performed in the set.
  weight:
    writable: true
    type: float
    min: 0
    description: Weight lifted in the set, in kilograms. Null for bodyweight exercises.
  done:
    writable: true
    type: bool
    filterable: true
    description: >-
      Whether the set was actually completed. Only ticked sets count towards the volume, the
      top sets and the rest of the stats, so a set left as false in a finished workout is one
      the user skipped. To repair a set that was lifted but never ticked before closing the
      workout, use the "mark_workout_set_done" tool instead of writing this field: it checks
      the set really belongs to that workout and leaves the correction in the event log.
  kind:
    writable: true
    enum: [warmup, effective]
    filterable: true
    description: >-
      Whether the set is a warmup ramp set or an effective working set. Only effective sets
      count towards volume and drive the weight progression.

relations: {}
