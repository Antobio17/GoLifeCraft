label: Diary entry

fields:
  entryDate:
    writable: true
    required: true
    min: 10
    max: 10
    regex: '^\d{4}-\d{2}-\d{2}$'
    description: >-
      The calendar day the food is logged to, as an ISO date "YYYY-MM-DD".
      Use the user's local date; default to today when not specified.
    filterable: true
    sortable: true
  meal:
    writable: true
    required: true
    enum: [breakfast, lunch, dinner, snack]
    description: >-
      The meal slot the entry belongs to: "breakfast", "lunch", "dinner" or "snack".
      Pick the slot that best fits the time or the food.
    filterable: true
  kind:
    writable: true
    required: true
    enum: [product, recipe, quick]
    description: >-
      Whether this entry references a catalog article ("product", quantity in grams),
      a recipe ("recipe", quantity in servings) or nothing at all ("quick", a free
      entry typed by hand, quantity in units). Use "quick" for one-off foods that are
      not worth creating an article or a recipe for.
    filterable: true
  refId:
    writable: true
    required: false
    max: 36
    description: >-
      The id of the referenced entity: an Article id when kind is "product",
      or a Recipe id when kind is "recipe". Leave it null when kind is "quick".
    filterable: true
  productionItemId:
    writable: false
    required: false
    max: 36
    description: >-
      Only for kind "recipe": the id of the cooked batch this plate is served from. When it is
      set, the breakdown and the macros come from what that batch was actually cooked with, not
      from the recipe, so swapping an ingredient while cooking is what the diary counts. Assigned
      on its own to the oldest batch with servings left, and changed by hand from the diary.
    filterable: true
  quantity:
    writable: true
    required: true
    type: float
    min: 0
    description: >-
      Amount in the entry's "unit" when kind is "product", number of servings of the
      recipe when kind is "recipe", or number of units when kind is "quick".
  unit:
    writable: true
    required: false
    max: 30
    enum: [g, ml, unit, slice, bread_slice, glass, serving, piece, can, jar, bag, carton, container, tablespoon, pack, handful]
    description: >-
      Only for kind "product": the unit the quantity is expressed in. Either the article's
      base unit ("g"/"ml") or one of its canonical equivalence alias keys (for example "glass").
      Keys are always stored in English; the UI translates them. Leave null to use the base
      unit. Ignored for kinds "recipe" and "quick".
  quickName:
    writable: true
    required: false
    max: 255
    description: >-
      Name of the free entry, only when kind is "quick" (for example "Menú del día").
  quickEmoji:
    writable: true
    required: false
    max: 16
    description: >-
      Emoji shown for the free entry, only when kind is "quick". Pick one that fits
      the food; defaults to a pencil when empty.
  quickCalories:
    writable: true
    required: false
    type: float
    min: 0
    description: >-
      Calories of ONE unit of the free entry, only when kind is "quick". The totals
      stored in the diary are this value multiplied by "quantity".
  quickProtein:
    writable: true
    required: false
    type: float
    min: 0
    description: Grams of protein per unit of the free entry, only when kind is "quick". Optional.
  quickFat:
    writable: true
    required: false
    type: float
    min: 0
    description: Grams of fat per unit of the free entry, only when kind is "quick". Optional.
  quickCarbs:
    writable: true
    required: false
    type: float
    min: 0
    description: Grams of carbs per unit of the free entry, only when kind is "quick". Optional.
  nameSnapshot:
    writable: false
    max: 255
    description: >-
      Name of the article or recipe as it was when the entry was logged. The diary never rewrites
      what was already eaten, so renaming the article afterwards leaves past entries alone.
  emojiSnapshot:
    writable: false
    max: 16
    description: Emoji of the article or recipe as it was when the entry was logged.
  caloriesSnapshot:
    writable: false
    type: float
    min: 0
    description: >-
      Calories of the whole entry, already multiplied by "quantity". Recalculated on its own after
      every write, from the recipe or from the cooked batch when there is one, so never write the
      totals: write "quantity" and read this back.
  proteinSnapshot:
    writable: false
    type: float
    min: 0
    description: Grams of protein of the whole entry, kept in step with caloriesSnapshot.
  fatSnapshot:
    writable: false
    type: float
    min: 0
    description: Grams of fat of the whole entry, kept in step with caloriesSnapshot.
  carbsSnapshot:
    writable: false
    type: float
    min: 0
    description: Grams of carbs of the whole entry, kept in step with caloriesSnapshot.
  customized:
    writable: false
    type: boolean
    description: >-
      True when the breakdown of this plate was edited by hand, which detaches it from the recipe:
      from then on the entry keeps its own tree and changes to the recipe no longer reach it.
    filterable: true
  consumed:
    writable: false
    type: boolean
    description: >-
      True once the meal has been ticked off as eaten, which is what discounts the servings from
      the recipe stock. It is only toggled from the diary, never by writing this field.
    filterable: true

relations:
  nodes:
    target: diary_entry_node
    kind: many
    foreign_field: diaryEntryId
    writable: false
    expandable: true

cascade_delete:
  - { resource: diary_entry_node, foreign_field: diaryEntryId }
