  Nutrition\Kitchen\Production\Application\Query\GetProductionsDataTransform:
    class: Nutrition\Kitchen\Production\Infrastructure\UI\API\DataTransform\ApiGetProductionsDataTransform

  Nutrition\Kitchen\Production\Application\Query\GetKitchenDayQueryHandler:
    class: Nutrition\Kitchen\Production\Application\Query\GetKitchenDayQueryHandler
    arguments:
      $needleDataQuery: '@Nutrition\Kitchen\Production\Domain\QueryModel\GetKitchenDayNeedleDataQuery'
