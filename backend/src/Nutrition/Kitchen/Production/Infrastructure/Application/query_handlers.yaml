      $dataTransform: '@Nutrition\Kitchen\Production\Application\Query\GetProductionDataTransform'
    tags:
      - { name: 'messenger.message_handler', bus: 'messenger.bus.default' }

  Nutrition\Kitchen\Production\Application\Query\GetProductionDataTransform:
