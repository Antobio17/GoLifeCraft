label: Production

fields:
  fromDate:
    writable: true
    required: true
    min: 10
    max: 10
    regex: '^\d{4}-\d{2}-\d{2}$'
    description: >-
      First day of the range the batch covers, as "YYYY-MM-DD". A production is planned from what
      the diary asks for across a range of days, summed: two days asking for three servings each
      become one batch of six.
    filterable: true
    sortable: true
  toDate:
    writable: true
    required: true
    min: 10
    max: 10
    regex: '^\d{4}-\d{2}-\d{2}$'
    description: Last day of the range the batch covers, as "YYYY-MM-DD". Never earlier than fromDate.
    filterable: true
    sortable: true
  status:
    writable: true
    required: true
    enum: [cooking, done]
    description: >-
      "cooking" while any recipe in the batch is still pending, "done" once every recipe has been
      cooked or the batch was closed by hand. Each recipe adds its servings to the recipe stock and
      discounts its articles from the pantry as it is cooked, not when the batch closes.
    filterable: true

relations:
  items:
    target: production_item
    kind: many
    writable: false
    expandable: true
