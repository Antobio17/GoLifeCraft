label: Production recipe

fields:
  productionId:
    writable: false
    min: 36
    max: 36
    description: Id of the batch this recipe belongs to.
    filterable: true
  position:
    writable: false
    type: integer
    min: 1
    description: Order of the recipe inside the batch.
    sortable: true
  recipeId:
    writable: false
    min: 36
    max: 36
    description: >-
      Id of the recipe to cook. The item keeps its own name and emoji snapshots, so editing the
      recipe afterwards never rewrites what was cooked.
    filterable: true
  status:
    writable: false
    enum: [pending, done]
    description: '"done" once this recipe has been cooked, which is what feeds the recipe stock.'
    filterable: true
  servingsPlanned:
    writable: false
    type: float
    min: 0
    description: >-
      Servings the proposal asked for, from the diary demand across the range minus what was
      already in stock or already planned in another open batch.
    sortable: true
  servingsCooked:
    writable: false
    type: float
    min: 0
    description: >-
      Servings actually cooked, decided while cooking and not when planning: the stock the proposal
      started from is an expectation. Cooking 4 when the plan said 2 leaves the extra 2 in stock.
    sortable: true
  nameSnapshot:
    writable: false
    max: 255
    description: Name of the recipe as it was when the batch was planned.
  emojiSnapshot:
    writable: false
    max: 16
    description: Emoji of the recipe as it was when the batch was planned.
  code:
    writable: false
    max: 16
    description: >-
      Short code the batch gets when it is cooked, like "L-042": what the cook writes on the tupper
      or the freezer bag. A diary entry points at a batch through it, so what was actually cooked
      is what the diary counts, even a month later.
    filterable: true
  label:
    writable: false
    max: 120
    description: >-
      Free text the cook adds when storing the batch, like "congelador cajón 2" or "3 tuppers".
      Only there to recognise the batch when picking it from the diary. Written from the kitchen
      screen, which is also what stamps the batch as cooked.
  customized:
    writable: false
    type: boolean
    description: >-
      True when the ingredients of this batch were changed before cooking, so its composition no
      longer matches the recipe. The diary entries eating from it count the changed composition.
    filterable: true

relations:
  consumptions:
    target: production_item_consumption
    kind: many
    foreign_field: productionItemId
    writable: false
    expandable: true
