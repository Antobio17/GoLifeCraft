services:
  Nutrition\GlobalCatalog\Article\Application\Query\GetGlobalArticlesQueryHandler:
    class: Nutrition\GlobalCatalog\Article\Application\Query\GetGlobalArticlesQueryHandler
    arguments:
      $needleDataQuery: '@Nutrition\GlobalCatalog\Article\Domain\QueryModel\GetGlobalArticlesNeedleDataQuery'
      $dataTransform: '@Nutrition\GlobalCatalog\Article\Application\Query\GetGlobalArticlesDataTransform'
    tags:
      - { name: 'messenger.message_handler', bus: 'messenger.bus.default' }

  Nutrition\GlobalCatalog\Article\Application\Query\GetGlobalArticleFacetsQueryHandler:
    class: Nutrition\GlobalCatalog\Article\Application\Query\GetGlobalArticleFacetsQueryHandler
    arguments:
      $needleDataQuery: '@Nutrition\GlobalCatalog\Article\Domain\QueryModel\GetGlobalArticleFacetsNeedleDataQuery'
    tags:
      - { name: 'messenger.message_handler', bus: 'messenger.bus.default' }

  Nutrition\GlobalCatalog\Article\Application\Query\GetGlobalArticlesDataTransform:
    class: Nutrition\GlobalCatalog\Article\Infrastructure\UI\API\DataTransform\ApiGetGlobalArticlesDataTransform

  Nutrition\GlobalCatalog\Article\Application\Query\GetGlobalArticleQueryHandler:
    class: Nutrition\GlobalCatalog\Article\Application\Query\GetGlobalArticleQueryHandler
    arguments:
      $needleDataQuery: '@Nutrition\GlobalCatalog\Article\Domain\QueryModel\GetGlobalArticleNeedleDataQuery'
      $dataTransform: '@Nutrition\GlobalCatalog\Article\Application\Query\GetGlobalArticleDataTransform'
    tags:
      - { name: 'messenger.message_handler', bus: 'messenger.bus.default' }

  Nutrition\GlobalCatalog\Article\Application\Query\GetGlobalArticleDataTransform:
    class: Nutrition\GlobalCatalog\Article\Infrastructure\UI\API\DataTransform\ApiGetGlobalArticleDataTransform
