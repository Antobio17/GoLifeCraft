services:
  Nutrition\Pantry\Stock\Application\Subscriber\DeleteArticleStockOnArticleDeleted:
    class: Nutrition\Pantry\Stock\Application\Subscriber\DeleteArticleStockOnArticleDeleted
    arguments:
      $messageBus: '@messenger.bus.default'
    tags:
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.article.deleted' }

  Nutrition\Pantry\Stock\Application\Subscriber\UpdateArticleStockOnProductionItemCookChanged:
    class: Nutrition\Pantry\Stock\Application\Subscriber\UpdateArticleStockOnProductionItemCookChanged
    arguments:
      $messageBus: '@messenger.bus.default'
    tags:
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.production.item_cooked' }
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.production.item_uncooked' }

  Nutrition\Pantry\Stock\Application\Subscriber\ClearArticleStockLocationOnLocationDeleted:
    class: Nutrition\Pantry\Stock\Application\Subscriber\ClearArticleStockLocationOnLocationDeleted
    arguments:
      $messageBus: '@messenger.bus.default'
    tags:
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.pantry_location.deleted' }

  Nutrition\Pantry\Stock\Application\Subscriber\UpdateArticleStockOnDiaryEntryConsumed:
    class: Nutrition\Pantry\Stock\Application\Subscriber\UpdateArticleStockOnDiaryEntryConsumed
    arguments:
      $messageBus: '@messenger.bus.default'
    tags:
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.diary_entry.consumed' }

  Nutrition\Pantry\Stock\Application\Subscriber\UpdateArticleStockOnInventoryValidated:
    class: Nutrition\Pantry\Stock\Application\Subscriber\UpdateArticleStockOnInventoryValidated
    arguments:
      $messageBus: '@messenger.bus.default'
    tags:
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.inventory.validated' }
