label: Article stock

fields:
  articleId:
    writable: true
    required: true
    min: 36
    max: 36
    unique: true
    description: >-
      Id of the article this stock belongs to. There is at most one stock row per article.
    filterable: true
  quantity:
    writable: true
    required: true
    type: float
    min: 0
    description: >-
      How much of the article is currently at home, always expressed in the article's base
      units ("g"/"ml"), never in packs. A full pack adds the quantity of the packUnit
      equivalence, so an article whose pack holds 500 g and of which two packs are stored
      has a stock of 1000. Use it for partially used packs too, for example 240 when a
      500 g pack is half empty.
    filterable: true
    sortable: true

relations: {}
