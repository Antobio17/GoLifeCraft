label: Article stock

fields:
  articleId:
    writable: false
    min: 36
    max: 36
    unique: true
    description: >-
      Id of the article this stock belongs to. There is at most one stock row per article.
    filterable: true
  quantity:
    writable: false
    type: float
    description: >-
      The best single estimate of how much of the article is at home, always in the article's
      base units ("g"/"ml"), never in packs. Read only: it is recomputed from the stock ledger
      as the last count of the article plus every movement dated after it, so writing it would
      be overwritten by the next recalculation. It can be negative, which means more has been
      eaten or cooked than was ever received. To correct it, use the "correct_article_stock"
      tool or take an inventory. Never read it without reading confidence next to it.
    filterable: true
    sortable: true
  trackingMode:
    writable: false
    enum: [exact, approximate, none]
    description: >-
      How much effort this article is worth. "exact" is for things that are counted one by one
      and never drift, like eggs, yoghurts or cans: the number is taken at face value.
      "approximate" is the default and is for things nobody weighs, like rice, pasta, meat or
      peanut butter: the number is carried along but surrounded by a band of doubt that widens
      as meals are logged and batches are cooked, until somebody looks again. "none" is for things not
      worth tracking: the number is still kept but no level and no confidence are claimed.
      Change it with the "set_article_stock_tracking" tool.
    filterable: true
  confidence:
    writable: false
    type: float
    description: >-
      How much this estimate can be trusted, from 0 to 1. It is set by the last observation and
      only ever falls from there: every meal logged or batch cooked widens the doubt, and buying
      moves the quantity without raising the confidence. Only somebody looking at the shelf raises it,
      through an inventory or a correction. Above 0.8 the number can be acted on; below 0.5 it
      is a guess and the shelf is worth a look. Always 1 on an "exact" article and 0 on a
      "none" one.
    filterable: true
    sortable: true
  minQuantity:
    writable: false
    type: float
    description: >-
      The pessimistic end of the estimate, never below zero. This is the number to use when
      deciding whether there is enough of something: if even this covers what is needed, there
      is enough for sure.
    filterable: true
    sortable: true
  maxQuantity:
    writable: false
    type: float
    description: >-
      The optimistic end of the estimate. If even this falls short of what is needed, the
      article has to be bought.
    filterable: true
    sortable: true
  level:
    writable: false
    enum: [unknown, empty, low, medium, high, full]
    description: >-
      The quantity read as a word, against the size of the article's pack: empty under 2% of
      it, low under 30%, medium under 65%, high under 100% and full at or over it. A quarter of
      a pack reads as low and half of one as medium, so the fractions a person taps come back as
      the words they expect. It is there to be shown and spoken, and it never replaces the
      quantity. "unknown" means the article is not tracked or has no pack to be read against.
    filterable: true

relations: {}
