label: Article stock

fields:
  articleId:
    writable: false
    min: 36
    max: 36
    unique: true
    description: >-
      Id of the article this stock belongs to. There is at most one stock row per article.
    filterable: true
  quantity:
    writable: false
    type: float
    description: >-
      How much of the article is currently at home, always expressed in the article's base
      units ("g"/"ml"), never in packs. Read only: it is recomputed from the stock ledger as
      the last stock count of the article plus every movement dated after it, so writing it
      would be overwritten by the next recalculation. It can be negative, which means more
      has been eaten or cooked than was ever received. To correct it, take a stock count.
    filterable: true
    sortable: true

relations: {}
