services:
  Nutrition\Pantry\RecipeStock\Application\Subscriber\DeleteRecipeStockOnRecipeDeleted:
    class: Nutrition\Pantry\RecipeStock\Application\Subscriber\DeleteRecipeStockOnRecipeDeleted
    arguments:
      $messageBus: '@messenger.bus.default'
    tags:
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.recipe.deleted' }

  Nutrition\Pantry\RecipeStock\Application\Subscriber\RecalculateRecipeStockOnStockMovementChanged:
    class: Nutrition\Pantry\RecipeStock\Application\Subscriber\RecalculateRecipeStockOnStockMovementChanged
    arguments:
      $messageBus: '@messenger.bus.default'
    tags:
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.stock_movement.registered' }
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.stock_movement.revoked' }
