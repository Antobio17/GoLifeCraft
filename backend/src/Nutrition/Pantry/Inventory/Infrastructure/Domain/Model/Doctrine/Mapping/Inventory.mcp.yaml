label: Stock count

fields:
  countedOn:
    writable: false
    max: 10
    description: >-
      Day the pantry was walked through, as "YYYY-MM-DD".
    filterable: true
    sortable: true
  shift:
    writable: false
    enum: [morning, afternoon]
    description: >-
      Time of day the count was taken, and with it where the count cuts the day. A morning
      count is the truth at 00:00, so everything bought, cooked or eaten that same day is
      added on top of it; an afternoon count is the truth at 23:59, so that same day's
      movements are already inside the number and are not counted again.
    filterable: true
  status:
    writable: false
    enum: [draft, validated]
    description: >-
      "draft" while the count is being filled in, "validated" once it has been applied and
      became history. Validating writes the counted quantities into the stock ledger as the
      new truth for every article and recipe it counted; reopening it takes them back out.
    filterable: true
  note:
    writable: false
    max: 255
    description: >-
      Free note written while counting, for example "faltaba el cajón del congelador".

relations:
  locations:
    target: inventory_location
    kind: many
    foreign_field: inventoryId
    writable: false
    expandable: true
