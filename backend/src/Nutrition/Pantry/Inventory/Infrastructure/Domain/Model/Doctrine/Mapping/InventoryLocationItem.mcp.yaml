label: Stock count item

fields:
  inventoryId:
    writable: false
    min: 36
    max: 36
    description: >-
      Id of the count this item belongs to.
    filterable: true
  inventoryLocationId:
    writable: false
    min: 36
    max: 36
    description: >-
      Id of the counted location this item was found in.
    filterable: true
  position:
    writable: false
    type: integer
    description: >-
      Order of the item inside its location.
    sortable: true
  kind:
    writable: false
    enum: [article, recipe]
    description: >-
      Whether the item counts an article or the cooked servings of a recipe.
    filterable: true
  refId:
    writable: false
    min: 36
    max: 36
    description: >-
      Id of the counted article or recipe, depending on the kind.
    filterable: true
  nameSnapshot:
    writable: false
    max: 255
    description: >-
      Name of the article or recipe as it was when the count started, kept so the history
      still reads right after a rename.
  emojiSnapshot:
    writable: false
    max: 16
    description: >-
      Emoji of the article or recipe when the count started.
  unit:
    writable: false
    max: 30
    description: >-
      Unit the quantities are expressed in: the article base unit ("g"/"ml"), or "serving"
      for a recipe.
  expectedQuantity:
    writable: false
    type: float
    description: >-
      What the app believed was there when the count started.
    sortable: true
  countedQuantity:
    writable: false
    type: float
    description: >-
      What was actually found, always in the base unit of the item. Empty when the item was
      never counted, in which case validating leaves that stock untouched.
    sortable: true
  countedUnit:
    writable: false
    max: 30
    description: >-
      Unit the count was typed in: the base unit itself or one of the article equivalences
      ("pack", "can"...). Only kept to show the number back the way it was entered.

relations: {}
