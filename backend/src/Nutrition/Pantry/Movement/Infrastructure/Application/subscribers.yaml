  Nutrition\Pantry\Movement\Application\Subscriber\RevokeStockMovementsOnProductionItemUncooked:
    class: Nutrition\Pantry\Movement\Application\Subscriber\RevokeStockMovementsOnProductionItemUncooked
    arguments:
      $messageBus: '@messenger.bus.default'
    tags:
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.production.item_uncooked' }
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.production.discarded' }

  Nutrition\Pantry\Movement\Application\Subscriber\RegisterStockCountsOnInventoryValidated:
    class: Nutrition\Pantry\Movement\Application\Subscriber\RegisterStockCountsOnInventoryValidated
    arguments:
      $messageBus: '@messenger.bus.default'
    tags:
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.inventory.validated' }

  Nutrition\Pantry\Movement\Application\Subscriber\RevokeStockCountsOnInventoryReopened:
    class: Nutrition\Pantry\Movement\Application\Subscriber\RevokeStockCountsOnInventoryReopened
    arguments:
      $messageBus: '@messenger.bus.default'
    tags:
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.inventory.reopened' }

  Nutrition\Pantry\Movement\Application\Subscriber\PurgeStockMovementsOnReferenceDeleted:
    class: Nutrition\Pantry\Movement\Application\Subscriber\PurgeStockMovementsOnReferenceDeleted
    arguments:
      $messageBus: '@messenger.bus.default'
    tags:
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.article.deleted' }
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.recipe.deleted' }
