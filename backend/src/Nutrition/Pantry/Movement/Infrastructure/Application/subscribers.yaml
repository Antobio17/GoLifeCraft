services:
  Nutrition\Pantry\Movement\Application\Subscriber\RegisterStockMovementsOnTicketReceived:
    class: Nutrition\Pantry\Movement\Application\Subscriber\RegisterStockMovementsOnTicketReceived
    arguments:
      $messageBus: '@messenger.bus.default'
    tags:
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.ticket.received' }

  Nutrition\Pantry\Movement\Application\Subscriber\RevokeStockMovementsOnTicketItemDropped:
    class: Nutrition\Pantry\Movement\Application\Subscriber\RevokeStockMovementsOnTicketItemDropped
    arguments:
      $messageBus: '@messenger.bus.default'
    tags:
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.ticket.unreceived' }
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.ticket.item_removed' }
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.ticket.deleted' }

  Nutrition\Pantry\Movement\Application\Subscriber\RegisterStockMovementOnDiaryEntryConsumed:
    class: Nutrition\Pantry\Movement\Application\Subscriber\RegisterStockMovementOnDiaryEntryConsumed
    arguments:
      $messageBus: '@messenger.bus.default'
    tags:
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.diary_entry.consumed' }

  Nutrition\Pantry\Movement\Application\Subscriber\RevokeStockMovementsOnDiaryEntryDeleted:
    class: Nutrition\Pantry\Movement\Application\Subscriber\RevokeStockMovementsOnDiaryEntryDeleted
    arguments:
      $messageBus: '@messenger.bus.default'
    tags:
      - { name: 'domain_event_subscriber', event: 'golifecraft.nutrition.event.1.diary_entry.deleted' }

  Nutrition\Pantry\Movement\Application\Subscriber\RegisterStockMovementsOnProductionItemCooked:
    class: Nutrition\Pantry\Movement\Application\Subscriber\RegisterStockMovementsOnProductionItemCooked
