services:
  Nutrition\Catalog\Article\Application\Query\GetArticlesQueryHandler:
    class: Nutrition\Catalog\Article\Application\Query\GetArticlesQueryHandler
    arguments:
      $needleDataQuery: '@Nutrition\Catalog\Article\Domain\QueryModel\GetArticlesNeedleDataQuery'
      $dataTransform: '@Nutrition\Catalog\Article\Application\Query\GetArticlesDataTransform'
    tags:
      - { name: 'messenger.message_handler', bus: 'messenger.bus.default' }

  Nutrition\Catalog\Article\Application\Query\GetArticlesDataTransform:
    class: Nutrition\Catalog\Article\Infrastructure\UI\API\DataTransform\ApiGetArticlesDataTransform

  Nutrition\Catalog\Article\Application\Query\GetArticleQueryHandler:
    class: Nutrition\Catalog\Article\Application\Query\GetArticleQueryHandler
    arguments:
      $needleDataQuery: '@Nutrition\Catalog\Article\Domain\QueryModel\GetArticleNeedleDataQuery'
      $dataTransform: '@Nutrition\Catalog\Article\Application\Query\GetArticleDataTransform'
    tags:
      - { name: 'messenger.message_handler', bus: 'messenger.bus.default' }

  Nutrition\Catalog\Article\Application\Query\GetArticleDataTransform:
    class: Nutrition\Catalog\Article\Infrastructure\UI\API\DataTransform\ApiGetArticleDataTransform

  Nutrition\Catalog\Article\Application\Query\GetArticleFacetsQueryHandler:
    class: Nutrition\Catalog\Article\Application\Query\GetArticleFacetsQueryHandler
    arguments:
      $needleDataQuery: '@Nutrition\Catalog\Article\Domain\QueryModel\GetArticleFacetsNeedleDataQuery'
    tags:
      - { name: 'messenger.message_handler', bus: 'messenger.bus.default' }

  Nutrition\Catalog\Article\Application\Query\GlobalArticleDraftAssembler:
    class: Nutrition\Catalog\Article\Application\Query\GlobalArticleDraftAssembler

  Nutrition\Catalog\Article\Application\Query\GetArticleDraftQueryHandler:
    class: Nutrition\Catalog\Article\Application\Query\GetArticleDraftQueryHandler
    arguments:
      $barcodeReader: '@Nutrition\Catalog\Article\Domain\Service\BarcodeReader'
      $globalArticleRepository: '@Nutrition\GlobalCatalog\Article\Domain\Model\GlobalArticleRepository'
      $globalArticleDraftAssembler: '@Nutrition\Catalog\Article\Application\Query\GlobalArticleDraftAssembler'
      $needleDataQuery: '@Nutrition\Catalog\Article\Domain\QueryModel\ArticleDraftGroundingNeedleDataQuery'
      $articleDraftExtractor: '@Nutrition\Catalog\Article\Domain\Service\ArticleDraftExtractor'
      $quotaGuard: '@Nutrition\Catalog\Article\Domain\Service\ArticleDraftQuotaGuard'
    tags:
      - { name: 'messenger.message_handler', bus: 'messenger.bus.default' }
