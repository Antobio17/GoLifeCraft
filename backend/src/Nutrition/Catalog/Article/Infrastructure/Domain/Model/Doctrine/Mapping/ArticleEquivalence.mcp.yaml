label: Article unit equivalence

fields:
  articleId:
    writable: true
    required: true
    min: 36
    max: 36
    description: >-
      The id of the Article this equivalence belongs to.
    filterable: true
  unit:
    writable: true
    required: true
    min: 1
    max: 30
    enum: [unit, slice, bread_slice, glass, serving, piece, can, jar, bag, carton, container, tablespoon, pack, handful]
    description: >-
      Canonical key of the natural unit alias (for example "unit", "slice", "glass", "can").
      One of these aliases equals "quantity" of the article's base unit. Keys are always
      stored in English; the UI translates them for display.
    filterable: true
  quantity:
    writable: true
    required: true
    type: float
    min: 0
    description: >-
      How many base units (grams or millilitres, per the article's baseUnit) one unit of
      the alias represents. Example: for "1 unidad = 60 g" set unit "unidad" and quantity 60.
  position:
    writable: true
    required: true
    type: int
    min: 1
    sortable: true

relations: {}
