label: Article

fields:
  name:
    writable: true
    required: true
    min: 2
    max: 255
    unique: true
    filterable: true
    sortable: true
  baseUnit:
    writable: true
    enum: [g, ml]
    description: >-
      The base unit the nutrition facts are expressed per 100 of: "g" for solids,
      "ml" for liquids. All equivalences convert their alias into this base unit.
    filterable: true
    sortable: true
  recipeUnit:
    writable: true
    max: 30
    enum: [g, ml, unit, slice, bread_slice, glass, serving, piece, can, jar, bag, carton, container, tablespoon, pack, handful]
    description: >-
      Default unit key used when the article is added to a recipe. Either the base
      unit ("g"/"ml") or one of the canonical alias keys, which must also exist as an
      equivalence of the article. Keys are always stored in English; the UI translates them.
    filterable: true
    sortable: true
  diaryUnit:
    writable: true
    max: 30
    enum: [g, ml, unit, slice, bread_slice, glass, serving, piece, can, jar, bag, carton, container, tablespoon, pack, handful]
    description: >-
      Default unit key used when the article is logged in the diary. Either the base
      unit ("g"/"ml") or one of the canonical alias keys, which must also exist as an
      equivalence of the article. Keys are always stored in English; the UI translates them.
    filterable: true
    sortable: true
  image:
    writable: false
    description: >-
      File name of the article photo, when it has one. It takes precedence over the emoji
      in the UI and is only readable through the article image endpoint, never as a public
      file. Uploaded from the app or downloaded when importing a global article.
  packUnit:
    writable: true
    max: 30
    enum: [unit, slice, bread_slice, glass, serving, piece, can, jar, bag, carton, container, tablespoon, pack, handful]
    filterable: true
    sortable: true
    description: >-
      Canonical alias key of the equivalence that represents the pack bought at the supermarket
      (for example "pack" when a pack of pasta holds 500 g). It must match the unit of one
      of the article's equivalences, whose quantity is then how much the pack holds in base units.
      Leave it empty when the article is not bought in a fixed pack.
  price:
    writable: true
    type: float
    min: 0
    filterable: true
    sortable: true
  brand:
    writable: true
    max: 120
    filterable: true
    sortable: true
  emoji:
    writable: true
    max: 16
    description: >-
      A single emoji that best represents the food product, based on its name and category.
      Always set exactly one emoji when creating or updating an article; do not leave it empty.
      Prefer the most specific food emoji available. Guidance by category:
      dairy/eggs 🥛🧀🧈🥚; fruit 🍎🍌🍊🍇🍓🍍🥝; vegetables 🥦🥕🍅🥬🥔🥑;
      meat/fish 🍗🥩🥓🍤🐟; cereals/bread 🌾🥣🍞🍚🍝; legumes/nuts 🥜🌰🫘;
      snacks/sweets 🍫🍪🍩🍬🍯; drinks 💧🥤🧃☕🍵; prepared meals 🍕🍔🥪🥗🥘;
      supplements/protein 💪; canned/other 🥫🧂. If nothing fits, use 🍽️.
  categoryId:
    writable: true
    min: 36
    max: 36
    filterable: true
  supermarketId:
    writable: true
    min: 36
    max: 36
    filterable: true
  aisleId:
    writable: true
    min: 36
    max: 36
    description: >-
      Id of the supermarket_aisle the article is found in, which must belong to the article's
      supermarketId. It drives the order of the shopping list: articles are grouped by aisle
      following the store route. Leave it empty when the aisle is unknown; those articles are
      grouped by category at the end of the list instead.
    filterable: true
  nutritionFactsId:
    writable: true
    min: 36
    max: 36
    filterable: true

relations: {}

cascade_delete:
  - { resource: article_equivalence, foreign_field: articleId }
  - { resource: article_stock, foreign_field: articleId }
  - { resource: nutrition_facts, local_field: nutritionFactsId }
