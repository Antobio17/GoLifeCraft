label: Article

fields:
  name:
    writable: true
    required: true
    min: 2
    max: 255
    unique: true
    filterable: true
    sortable: true
  baseUnit:
    writable: true
    enum: [g, ml]
    description: >-
      The base unit the nutrition facts are expressed per 100 of: "g" for solids,
      "ml" for liquids. All equivalences convert their alias into this base unit.
    filterable: true
    sortable: true
  recipeUnit:
    writable: true
    max: 30
    description: >-
      Default unit key used when the article is added to a recipe. Either the base
      unit ("g"/"ml") or the name of one of the article's equivalence aliases.
    filterable: true
    sortable: true
  diaryUnit:
    writable: true
    max: 30
    description: >-
      Default unit key used when the article is logged in the diary. Either the base
      unit ("g"/"ml") or the name of one of the article's equivalence aliases.
    filterable: true
    sortable: true
  packUnit:
    writable: true
    max: 30
    filterable: true
    sortable: true
    description: >-
      Name of the equivalence alias that represents the pack bought at the supermarket
      (for example "paquete" when a pack of pasta holds 500 g). It must match the unit of one
      of the article's equivalences, whose quantity is then how much the pack holds in base units.
      Leave it empty when the article is not bought in a fixed pack.
  price:
    writable: true
    type: float
    min: 0
    filterable: true
    sortable: true
  brand:
    writable: true
    max: 120
    filterable: true
    sortable: true
  emoji:
    writable: true
    max: 16
    description: >-
      A single emoji that best represents the food product, based on its name and category.
      Always set exactly one emoji when creating or updating an article; do not leave it empty.
      Prefer the most specific food emoji available. Guidance by category:
      dairy/eggs 🥛🧀🧈🥚; fruit 🍎🍌🍊🍇🍓🍍🥝; vegetables 🥦🥕🍅🥬🥔🥑;
      meat/fish 🍗🥩🥓🍤🐟; cereals/bread 🌾🥣🍞🍚🍝; legumes/nuts 🥜🌰🫘;
      snacks/sweets 🍫🍪🍩🍬🍯; drinks 💧🥤🧃☕🍵; prepared meals 🍕🍔🥪🥗🥘;
      supplements/protein 💪; canned/other 🥫🧂. If nothing fits, use 🍽️.
  categoryId:
    writable: true
    min: 36
    max: 36
    filterable: true
  supermarketId:
    writable: true
    min: 36
    max: 36
    filterable: true
  nutritionFactsId:
    writable: true
    min: 36
    max: 36
    filterable: true

relations: {}
