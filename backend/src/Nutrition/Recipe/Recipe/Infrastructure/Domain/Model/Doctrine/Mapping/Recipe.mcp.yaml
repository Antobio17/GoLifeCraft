label: Recipe

fields:
  name:
    writable: true
    required: true
    min: 2
    max: 255
    unique: true
    filterable: true
    sortable: true
  emoji:
    writable: true
    required: true
    max: 16
    description: >-
      A single emoji that best represents the recipe, based on its name and category.
      Always set exactly one emoji when creating or updating a recipe; do not leave it empty.
      Guidance by category: breakfast 🥣🍳🥐🧇; lunch/dinner 🍲🥘🍝🍚🥗🍔🌮; snack 🍎🥜🧀🍪;
      sauce/base 🥫🧂🫙; dessert 🍰🍮🍫🍩; drink 🥤🧃☕🍵. If nothing fits, use 🍽️.
  image:
    writable: false
    description: >-
      File name of the recipe photo, when it has one. It takes precedence over the emoji
      in the UI and is only readable through the recipe image endpoint, never as a public
      file. Uploaded from the app.
  category:
    writable: true
    required: true
    enum: [Desayuno, Comida, Cena, Snack, Salsa base, Postre, Bebida]
    filterable: true
    sortable: true
  servings:
    writable: true
    required: true
    type: int
    min: 1
    max: 20
    sortable: true
  prepMode:
    writable: true
    required: false
    type: string
    enum: [batch, same_day]
    filterable: true
    description: >-
      How the dish reaches the plate. "batch" is the default: it can be cooked days ahead in one
      go and kept in the fridge or the freezer, so the kitchen groups it into the weekly batch and
      adds up everything the diary asks for across the whole range. "same_day" is a dish that only
      works cooked the day it is eaten, so the kitchen keeps it in the same production but lists it
      once per day, marked with the day it is due, instead of merging it into the batch.

relations: {}

cascade_delete:
  - { resource: recipe_ingredient, foreign_field: recipeId }
  - { resource: recipe_step, foreign_field: recipeId }
  - { resource: recipe_stock, foreign_field: recipeId }
