<ds-dashboard-layout>
  <ds-greeting-header
    slot="header"
    [date]="today | date: 'EEEE, d MMM'"
    [greeting]="'dashboard.greeting' | t"
    [name]="name()"
    [initial]="initial()"
    [avatarLabel]="'dashboard.avatar.settings' | t"
    (avatarClick)="goToSettings()"
  />

  <ds-stack slot="summary" [gap]="'10px'">
    <ds-section-header
      [title]="'dashboard.summary.title' | t"
      [actionLabel]="'dashboard.summary.more' | t"
      (action)="goToDiary()"
    />
    @if (summaryLoading()) {
      <ds-skeleton-summary macros="bars" />
    } @else if (summary(); as diary) {
      <ds-diary-summary
        [eyebrow]="'dashboard.summary.total' | t"
        [countLabel]="view.countLabel(diary.entryCount)"
        [percent]="diary.percent"
        [consumed]="view.integer(diary.consumedCalories)"
        [goal]="view.integer(diary.goalCalories)"
        [footnote]="view.caloriesFootnote(diary)"
        [over]="view.exceedsCalories(diary)"
        [macros]="view.goalMacros(diary)"
      />
    }
  </ds-stack>

  <app-agenda-summary slot="agenda" (seeAll)="goToAgenda()" />

  <app-gym-analytics
    slot="gym"
    [stats]="gymStats()"
    [loading]="gymStatsLoading()"
    (seeAll)="goToGym()"
  />

  <ds-stack slot="explore" [gap]="'11px'">
    <ds-section-header
      [title]="'dashboard.explore.title' | t"
      [staticLabel]="'dashboard.explore.quickAccess' | t"
    />
    <ds-grid [columns]="2" [gap]="'10px'">
      <ds-action-tile
        icon="leaf"
        [name]="'dashboard.explore.catalog' | t"
        [meta]="'dashboard.explore.catalogMeta' | t"
        (clicked)="goToCatalog()"
      />
      <ds-action-tile
        icon="dumbbell"
        [name]="'dashboard.explore.gym' | t"
        [meta]="'dashboard.explore.gymMeta' | t"
        (clicked)="goToGym()"
      />
      <ds-action-tile
        icon="chefHat"
        [name]="'dashboard.explore.recipes' | t"
        [meta]="'dashboard.explore.recipesMeta' | t"
        (clicked)="goToRecipes()"
      />
      <ds-action-tile
        icon="cart"
        [name]="'dashboard.explore.list' | t"
        [meta]="'dashboard.explore.listMeta' | t"
        (clicked)="goToShopping()"
      />
    </ds-grid>
  </ds-stack>
</ds-dashboard-layout>
