<ds-dashboard-layout>
  <ds-greeting-header
    data-testid="dashboard-greeting"
    slot="header"
    [date]="today | date: 'EEEE, d MMM'"
    [greeting]="'dashboard.greeting' | t"
    [name]="name()"
    [subtitle]="
      headlineKey() ? (headlineKey() | t: { kcal: headlineKcal() }) : ''
    "
    [initial]="initial()"
    [imageUrl]="avatarUrl()"
    [avatarLabel]="'dashboard.avatar.settings' | t"
    (avatarClick)="goToSettings()"
  >
    <ds-notification-bell
      slot="actions"
      data-testid="dashboard-notifications"
      [count]="unreadNotifications()"
      [ariaLabel]="
        (unreadNotifications() > 0
          ? 'notifications.bellUnread'
          : 'notifications.bell'
        ) | t: { count: unreadNotifications() }
      "
      (clicked)="goToNotifications()"
    />
  </ds-greeting-header>

  <ds-stack slot="summary" [gap]="'var(--ds-space-2)'">
    <ds-section-header
      [title]="'dashboard.summary.title' | t"
      [actionLabel]="'dashboard.summary.more' | t"
      (action)="goToDiary()"
    />
    @if (summaryLoading()) {
      <ds-module-card>
        <ds-stack [gap]="'var(--ds-space-3)'">
          <ds-skeleton-line width="40%" height="0.75rem" />
          <ds-skeleton-line width="70%" height="1.75rem" />
          <ds-skeleton-line width="45%" height="1rem" />
          <ds-skeleton-line width="100%" height="0.5rem" />
          <ds-skeleton-line width="100%" height="3.5rem" />
          <ds-skeleton-line width="35%" height="1.5rem" />
        </ds-stack>
      </ds-module-card>
    } @else if (summary(); as diary) {
      @let card = summaryCard()!;
      <ds-calorie-summary
        data-testid="dashboard-summary"
        [eyebrow]="'dashboard.summary.total' | t"
        [statusLabel]="card.statusKey | t"
        [statusTone]="card.statusTone"
        [title]="card.headlineKey | t: { kcal: card.kcal }"
        [over]="card.over"
        [caption]="'getDiary.summary.caption' | t: card.caption"
        [segments]="card.segments"
        [marker]="card.marker"
        [stats]="card.stats"
      />
    }
  </ds-stack>

  <app-agenda-summary
    slot="agenda"
    data-module="agenda"
    (seeAll)="goToAgenda()"
  />

  <app-finance-savings-summary
    slot="balance"
    data-module="finance"
    (seeAll)="goToBudget()"
  />

  <app-gym-analytics
    slot="gym"
    data-module="gym"
    [stats]="gymStats()"
    [loading]="gymStatsLoading()"
    (seeAll)="goToGym()"
  />

  <ds-stack slot="explore" [gap]="'var(--ds-space-2)'">
    <ds-section-header
      [title]="'dashboard.explore.title' | t"
      [staticLabel]="'dashboard.explore.quickAccess' | t"
    />
    <ds-module-card>
      <ds-stack [gap]="'var(--ds-space-1)'">
        <ds-link-row
          data-testid="dashboard-tile-agenda"
          data-module="agenda"
          icon="agenda"
          [title]="'dashboard.explore.agenda' | t"
          [meta]="'dashboard.explore.agendaMeta' | t"
          (clicked)="goToNewAgendaEntry()"
        />
        <ds-link-row
          data-testid="dashboard-tile-movement"
          data-module="finance"
          icon="wallet"
          [title]="'dashboard.explore.movement' | t"
          [meta]="'dashboard.explore.movementMeta' | t"
          (clicked)="goToNewMovement()"
        />
        <ds-link-row
          data-testid="dashboard-tile-shopping"
          icon="cart"
          [title]="'dashboard.explore.list' | t"
          [meta]="'dashboard.explore.listMeta' | t"
          (clicked)="goToShopping()"
        />
        <ds-link-row
          data-testid="dashboard-tile-gym"
          data-module="gym"
          icon="dumbbell"
          [title]="'dashboard.explore.gym' | t"
          [meta]="'dashboard.explore.gymMeta' | t"
          (clicked)="goToGym()"
        />
      </ds-stack>
    </ds-module-card>
  </ds-stack>
</ds-dashboard-layout>
