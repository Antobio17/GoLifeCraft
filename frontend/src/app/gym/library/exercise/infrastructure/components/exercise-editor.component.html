<ds-page-wrapper [maxWidth]="'40rem'" [gap]="'var(--ds-space-5)'">
  <ds-screen-header
    [sticky]="true"
    [leading]="'close'"
    [leadingLabel]="'createExercise.back' | t"
    [title]="title"
    (leadingClick)="cancel()"
  >
    <ds-button
      slot="actions"
      data-testid="editor-submit"
      type="button"
      variant="primary"
      size="icon-lg"
      icon="save"
      [iconSize]="19"
      [ariaLabel]="saveLabel"
      [disabled]="!draft.hasChanges()"
      [loading]="saving()"
      (clicked)="save()"
    />
  </ds-screen-header>

  <form dsEditorForm [formGroup]="form" (ngSubmit)="onSubmit()">
    <ds-stack [gap]="'var(--ds-space-5)'">
      <ds-stack direction="row" align="end" [gap]="'var(--ds-space-3)'">
        <ds-field [label]="'createExercise.field.icon' | t">
          <ds-icon-picker
            formControlName="icon"
            [groups]="iconGroups"
            [sheetTitle]="'createExercise.field.iconSheetTitle' | t"
            [closeLabel]="'createExercise.field.iconClose' | t"
            [triggerLabel]="'createExercise.field.iconTrigger' | t"
            [searchPlaceholder]="'createExercise.field.iconSearch' | t"
            [emptyLabel]="'createExercise.field.iconEmpty' | t"
          />
        </ds-field>
        <ds-field [grow]="true" [label]="'createExercise.field.name' | t">
          <ds-text-input
            variant="outlined"
            formControlName="name"
            [placeholder]="'createExercise.field.namePlaceholder' | t"
          />
        </ds-field>
      </ds-stack>

      <ds-field
        [label]="'createExercise.field.muscleGroups' | t"
        [count]="form.get('muscleGroups')?.value?.length ?? 0"
      >
        <ds-muscle-picker
          [groups]="muscleGroups"
          formControlName="muscleGroups"
        />
      </ds-field>

      <ds-field
        [label]="'createExercise.field.type' | t"
        [hint]="modeHint"
        [hintIcon]="true"
      >
        <ds-segmented-toggle [options]="typeOptions" formControlName="type" />
      </ds-field>

      <ds-field
        [label]="'createExercise.field.weightMode' | t"
        [hint]="weightModeHint()"
        [hintIcon]="true"
      >
        <ds-segmented-toggle
          [options]="weightModeOptions()"
          formControlName="weightMode"
        />
      </ds-field>
    </ds-stack>
  </form>
</ds-page-wrapper>

<ds-discard-changes-modal
  [show]="draft.confirmingDiscard()"
  (confirmed)="draft.discard()"
  (cancelled)="draft.keepEditing()"
/>
