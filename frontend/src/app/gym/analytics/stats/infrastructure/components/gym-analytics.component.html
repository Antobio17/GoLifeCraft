<ds-stack dsReveal [gap]="'var(--ds-space-2)'">
  <ds-section-header
    [title]="'dashboard.gym.title' | t"
    [actionLabel]="'dashboard.gym.seeAll' | t"
    (action)="seeAll.emit()"
  />

  @if (loading()) {
    <ds-module-card>
      <ds-stack [gap]="'var(--ds-space-3)'">
        <ds-skeleton-line width="40%" height="0.75rem" />
        <ds-skeleton-line width="45%" height="2.25rem" />
        <ds-skeleton-line width="100%" height="6.75rem" />
        <ds-skeleton-line width="100%" height="3.5rem" />
      </ds-stack>
    </ds-module-card>
  } @else if (!hasData()) {
    <ds-cta-row
      icon="dumbbell"
      [dashed]="true"
      [title]="'dashboard.gym.activity.title' | t"
      [subtitle]="'dashboard.gym.empty' | t"
      (clicked)="seeAll.emit()"
    />
  } @else {
    <ds-module-card [eyebrow]="'dashboard.gym.activity.title' | t">
      <ds-big-figure
        [value]="activity().activeDays"
        [suffix]="'dashboard.gym.activity.subtitle' | t"
      />

      <ds-activity-heatmap
        class="panel__heatmap"
        [weeks]="activity().weeks"
        [months]="activity().months"
        [weekdayLabels]="activity().weekdays"
        [legendLess]="'dashboard.gym.activity.less' | t"
        [legendMore]="'dashboard.gym.activity.more' | t"
      />

      <ds-stat-strip [compact]="true" [items]="statItems()" />
    </ds-module-card>
  }
</ds-stack>
