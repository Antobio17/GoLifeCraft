<ds-stack [gap]="'0.625rem'">
  <ds-section-header
    [title]="'dashboard.gym.title' | t"
    [actionLabel]="'dashboard.gym.seeAll' | t"
    (action)="seeAll.emit()"
  />

  @if (loading()) {
    <ds-skeleton-metrics
      [count]="3"
      [gap]="'0.5rem'"
      padding="0.6875rem 0.75rem"
    />
    <ds-skeleton-panel
      [figure]="true"
      content="heatmap"
      chartHeight="6.75rem"
    />
    <ds-grid [minColumn]="'15rem'" [gap]="'0.625rem'">
      <ds-skeleton-panel
        [brand]="true"
        content="spark"
        chartHeight="3.375rem"
      />
      <ds-skeleton-panel content="meters" [meters]="4" />
    </ds-grid>
  } @else if (!hasData()) {
    <ds-text variant="muted">{{ "dashboard.gym.empty" | t }}</ds-text>
  } @else {
    <ds-stack direction="row" [gap]="'0.5rem'">
      <ds-stat-tile
        [value]="stats()!.totalSessions"
        [label]="'dashboard.gym.sessions' | t"
      />
      <ds-stat-tile
        [value]="totalVolumeText()"
        unit="kg"
        [label]="'dashboard.gym.volume' | t"
      />
      <ds-stat-tile
        [value]="stats()!.totalExercises"
        [label]="'dashboard.gym.exercises' | t"
      />
    </ds-stack>

    <ds-panel
      [title]="'dashboard.gym.activity.title' | t"
      [subtitle]="'dashboard.gym.activity.subtitle' | t"
      [figure]="
        'dashboard.gym.activity.figure' | t: { days: activity().activeDays }
      "
    >
      <ds-activity-heatmap
        class="panel__heatmap"
        [weeks]="activity().weeks"
        [months]="activity().months"
        [weekdayLabels]="activity().weekdays"
        [legendLess]="'dashboard.gym.activity.less' | t"
        [legendMore]="'dashboard.gym.activity.more' | t"
      />
    </ds-panel>

    <ds-grid [minColumn]="'15rem'" [gap]="'0.625rem'">
      <ds-panel
        [brand]="true"
        [title]="'dashboard.gym.progression.title' | t"
        [subtitle]="'dashboard.gym.progression.subtitle' | t"
      >
        @if (progressionDelta(); as delta) {
          <ds-trend-badge
            slot="aside"
            [positive]="delta.positive"
            [label]="delta.label"
          />
        }
        @if (hasProgression()) {
          <ds-line-chart class="panel__spark" [points]="progressionPoints()" />
        } @else {
          <ds-text variant="meta" [inherit]="true">
            {{ "dashboard.gym.progression.empty" | t }}
          </ds-text>
        }
      </ds-panel>

      <ds-panel
        [title]="'dashboard.gym.muscles.title' | t"
        [subtitle]="'dashboard.gym.muscles.subtitle' | t"
      >
        <ds-stack class="muscles" [gap]="'0.75rem'">
          @for (region of regionShares(); track region.region) {
            <ds-meter
              [label]="region.region"
              [percent]="region.percent"
              [color]="region.color"
            />
          }
        </ds-stack>
      </ds-panel>
    </ds-grid>
  }
</ds-stack>
