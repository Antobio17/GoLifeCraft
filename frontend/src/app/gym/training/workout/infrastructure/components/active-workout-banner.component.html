@if (visible()) {
  <ds-floating-workout-banner
    [paused]="activeWorkout.paused()"
    [stateLabel]="
      (activeWorkout.paused()
        ? 'workout.banner.paused'
        : 'workout.banner.active'
      ) | t
    "
    [elapsedLabel]="activeWorkout.elapsedLabel()"
    [name]="activeWorkout.activeName()"
    [goLabel]="'workout.banner.goToSession' | t"
    (go)="goToSession()"
  />
}
