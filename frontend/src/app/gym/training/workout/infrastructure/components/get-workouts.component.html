<ds-page-wrapper [gap]="'var(--ds-space-3)'">
  <ds-screen-header
    [leading]="'back'"
    [leadingLabel]="'getWorkouts.back' | t"
    [eyebrow]="'getWorkouts.eyebrow' | t"
    [title]="'getWorkouts.heading' | t"
    [subtitle]="headerSubtitle()"
    (leadingClick)="goBack()"
  />

  @if (loading()) {
    <ds-skeleton-list
      [count]="4"
      [columns]="null"
      minColumn="16.25rem"
      [tabletColumns]="2"
      [gap]="'var(--ds-space-2)'"
      radius="var(--ds-radius-xl)"
      padding="var(--ds-space-3)"
      [alignTop]="true"
      titleWidth="56%"
      metaWidth="46%"
      headTrailing="4rem"
      [progress]="true"
      [footItems]="2"
    />
  } @else if (items().length === 0) {
    <ds-empty-state
      icon="history"
      [title]="'getWorkouts.empty.title' | t"
      [text]="'getWorkouts.empty.text' | t"
    />
  } @else {
    <ds-grid
      dsReveal="children"
      [minColumn]="'16.25rem'"
      [gap]="'var(--ds-space-2)'"
      [tabletColumns]="2"
    >
      @for (workout of rows(); track workout.id) {
        <ds-card
          [interactive]="true"
          [padding]="'var(--ds-space-3)'"
          [gap]="'var(--ds-space-3)'"
          (activated)="onOpen(workout.id)"
        >
          <ds-stack
            direction="row"
            align="start"
            justify="between"
            [gap]="'var(--ds-space-2)'"
          >
            <ds-stack [gap]="'2px'">
              <ds-heading [level]="3" size="md">
                {{ workout.sessionName }}
              </ds-heading>
              <ds-text variant="meta">
                {{ workout.dateLabel }}
              </ds-text>
            </ds-stack>

            <ds-chip tone="brand">
              <ds-stack
                direction="row"
                align="center"
                [gap]="'var(--ds-space-1)'"
              >
                <ds-icon name="check" [size]="12" [stroke]="3" />
                {{ workout.ratioLabel }}
              </ds-stack>
            </ds-chip>
          </ds-stack>

          <ds-progress-bar [value]="workout.progressPercent" />

          <ds-stack direction="row" [gap]="'var(--ds-space-3)'" [wrap]="true">
            <ds-meta-item icon="clock">
              {{ workout.durationLabel }}
            </ds-meta-item>
            <ds-meta-item icon="dumbbell">
              {{ workout.exercisesLabel }}
            </ds-meta-item>
          </ds-stack>
        </ds-card>
      }
    </ds-grid>

    @if (loadingMore()) {
      <ds-skeleton-list
        [count]="2"
        [columns]="null"
        minColumn="16.25rem"
        [tabletColumns]="2"
        [gap]="'var(--ds-space-2)'"
        radius="var(--ds-radius-xl)"
        padding="var(--ds-space-3)"
        [alignTop]="true"
        titleWidth="56%"
        metaWidth="46%"
        headTrailing="4rem"
        [progress]="true"
        [footItems]="2"
      />
    }

    <ds-infinite-scroll
      [disabled]="loadingMore() || !hasMore()"
      (reached)="loadMore()"
    />
  }
</ds-page-wrapper>
