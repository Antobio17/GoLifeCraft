<ds-page-wrapper [maxWidth]="'40rem'" [gap]="'var(--ds-space-5)'">
  <ds-screen-header
    [leading]="'close'"
    [leadingLabel]="'createSession.back' | t"
    [title]="title"
    (leadingClick)="cancel()"
  />

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <ds-stack [gap]="'var(--ds-space-5)'">
      <ds-field [label]="'createSession.field.name' | t">
        <ds-text-input
          variant="outlined"
          formControlName="name"
          [placeholder]="'createSession.field.namePlaceholder' | t"
        />
      </ds-field>

      <ds-field [label]="durationLabel()">
        <ds-duration-choice
          formControlName="estimatedDurationMinutes"
          [options]="durationOptions"
          [customLabel]="customLabel()"
          [customAriaLabel]="durationCustomAriaLabel()"
          [unit]="durationUnit()"
          [min]="1"
          [max]="600"
        />
      </ds-field>

      <ds-field [label]="restLabel()" [hint]="restHint()" [hintIcon]="true">
        <ds-duration-choice
          formControlName="restSeconds"
          [options]="restOptions"
          [customLabel]="customLabel()"
          [customAriaLabel]="restCustomAriaLabel()"
          [unit]="restUnit()"
          [min]="0"
          [max]="3600"
        />
      </ds-field>

      <ds-button
        type="submit"
        variant="soft"
        [fullWidth]="true"
        [loading]="saving()"
        [disabled]="saving()"
      >
        {{ saving() ? ("createSession.saving" | t) : saveLabel }}
      </ds-button>
    </ds-stack>
  </form>
</ds-page-wrapper>
