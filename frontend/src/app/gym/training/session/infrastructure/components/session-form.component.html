<ds-page-wrapper [maxWidth]="'40rem'" [gap]="'var(--ds-space-5)'">
  <ds-screen-header
    [sticky]="true"
    [leading]="'close'"
    [leadingLabel]="'createSession.back' | t"
    [title]="title"
    (leadingClick)="cancel()"
  >
    <ds-button
      slot="actions"
      data-testid="editor-submit"
      type="button"
      variant="primary"
      size="icon-lg"
      icon="save"
      [iconSize]="19"
      [ariaLabel]="saveLabel"
      [disabled]="!draft.hasChanges()"
      [loading]="saving()"
      (clicked)="save()"
    />
  </ds-screen-header>

  <form dsEditorForm [formGroup]="form" (ngSubmit)="onSubmit()">
    <ds-stack [gap]="'var(--ds-space-5)'">
      <ds-field [label]="'createSession.field.name' | t">
        <ds-text-input
          variant="outlined"
          formControlName="name"
          [placeholder]="'createSession.field.namePlaceholder' | t"
        />
      </ds-field>

      <ds-field [label]="durationLabel()">
        <ds-duration-choice
          formControlName="estimatedDurationMinutes"
          [options]="durationOptions"
          [customLabel]="customLabel()"
          [customAriaLabel]="durationCustomAriaLabel()"
          [unit]="durationUnit()"
          [min]="1"
          [max]="600"
        />
      </ds-field>

      <ds-field [label]="restLabel()" [hint]="restHint()" [hintIcon]="true">
        <ds-duration-choice
          formControlName="restSeconds"
          [options]="restOptions"
          [customLabel]="customLabel()"
          [customAriaLabel]="restCustomAriaLabel()"
          [unit]="restUnit()"
          [min]="0"
          [max]="3600"
        />
      </ds-field>

      <ds-preference-toggle
        data-testid="session-progression-enabled"
        icon="📈"
        [title]="progressionLabel()"
        [subtitle]="progressionHint()"
        [checked]="!!form.value.progressionEnabled"
        (toggled)="toggleProgressionEnabled()"
      />
    </ds-stack>
  </form>
</ds-page-wrapper>

<ds-discard-changes-modal
  [show]="draft.confirmingDiscard()"
  (confirmed)="draft.discard()"
  (cancelled)="draft.keepEditing()"
/>
