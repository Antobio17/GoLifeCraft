<ds-page-wrapper [maxWidth]="'35rem'" [gap]="'0'">
  <ds-stack [gap]="'var(--ds-space-3)'">
    <ds-screen-header
      leading="back"
      [leadingLabel]="'users.back' | t"
      [eyebrow]="'users.eyebrow' | t"
      [title]="'users.title' | t"
      (leadingClick)="back()"
    >
      <ds-chip slot="actions" tone="brand" [uppercase]="true">{{
        "users.adminOnly" | t
      }}</ds-chip>
    </ds-screen-header>

    @if (loading()) {
      <ds-stack [gap]="'var(--ds-space-5)'">
        <ds-skeleton-metrics
          [count]="3"
          [gap]="'var(--ds-space-2)'"
          [feature]="true"
        />

        <ds-stack [gap]="'var(--ds-space-2)'">
          <ds-skeleton-line width="8.875rem" height="0.75rem" />
          <ds-skeleton-list
            [count]="4"
            [gap]="'var(--ds-space-2)'"
            radius="var(--ds-radius-xl)"
            padding="var(--ds-space-3) var(--ds-space-3)"
            [tile]="44"
            [tileRadius]="22"
            titleWidth="52%"
            metaWidth="68%"
            [chips]="1"
            trailing="pill"
            pillWidth="3.875rem"
            pillHeight="1.75rem"
          />
        </ds-stack>

        <ds-skeleton-note [lines]="2" />
      </ds-stack>
    } @else {
      <ds-stack [gap]="'var(--ds-space-5)'">
        <ds-stack direction="row" [gap]="'var(--ds-space-2)'">
          <ds-metric-card
            [value]="total()"
            [label]="'users.summary.requests' | t"
          ></ds-metric-card>
          <ds-metric-card
            [value]="verifiedCount()"
            [label]="'users.summary.verified' | t"
          ></ds-metric-card>
          <ds-metric-card
            variant="feature"
            [value]="activeCount()"
            [label]="'users.summary.withAccess' | t"
          ></ds-metric-card>
        </ds-stack>

        <ds-stack [gap]="'var(--ds-space-2)'">
          <ds-text variant="label">{{ "users.section.requests" | t }}</ds-text>

          @if (rows().length === 0) {
            <ds-empty-state
              icon="users"
              [title]="'users.empty.title' | t"
              [text]="'users.empty.text' | t"
            ></ds-empty-state>
          } @else {
            @for (row of rows(); track row.id) {
              <ds-user-access-row
                [initial]="row.initial"
                [name]="row.name"
                [email]="row.email"
                [verified]="row.verified"
                [verifiedLabel]="'users.badge.verified' | t"
                [unverifiedLabel]="'users.badge.unverified' | t"
                [active]="row.active"
                [activeLabel]="'users.access.active' | t"
                [inactiveLabel]="'users.access.inactive' | t"
                [disabled]="row.saving"
                [ariaLabel]="'users.access.toggleAria' | t"
                [selectable]="true"
                [selectAriaLabel]="'users.openAria' | t"
                (toggled)="onToggle(row)"
                (selected)="openUser(row)"
              ></ds-user-access-row>
            }
          }
        </ds-stack>

        <ds-note icon="info">{{ "users.note" | t }}</ds-note>
      </ds-stack>
    }
  </ds-stack>
</ds-page-wrapper>
