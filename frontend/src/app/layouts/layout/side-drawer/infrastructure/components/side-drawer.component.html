<div class="drawer-root" [class.is-open]="isOpen()">
  <button
    type="button"
    class="drawer-scrim"
    [attr.tabindex]="isOpen() ? 0 : -1"
    [attr.aria-label]="'navbar.closeMenu' | t"
    (click)="close()"
  ></button>

  <aside
    class="drawer"
    role="dialog"
    aria-modal="true"
    [attr.aria-hidden]="!isInteractive()"
    [attr.inert]="isInteractive() ? null : ''"
  >
    <span class="drawer__grip" aria-hidden="true"></span>

    <header class="drawer__brand">
      <ds-brand-logo [markSize]="34" [wordmarkSize]="17"></ds-brand-logo>
    </header>

    <div class="drawer__profile">
      <a class="drawer__user" routerLink="/me" (click)="close()">
        <ds-avatar [initial]="initial()" [size]="46" />
        <span class="drawer__user-text">
          <span class="drawer__user-name">{{ displayName() }}</span>
          <span class="drawer__user-email">{{ email() }}</span>
        </span>
      </a>

      <ds-icon-button
        class="drawer__close"
        icon="close"
        variant="soft"
        [size]="32"
        [iconSize]="15"
        [stroke]="2.2"
        [radius]="'var(--ds-radius-pill)'"
        [ariaLabel]="'navbar.closeMenu' | t"
        (clicked)="close()"
      />
    </div>

    <ds-divider class="drawer__rule drawer__rule--top" />

    <nav class="drawer__nav" [attr.aria-label]="'navbar.openMenu' | t">
      <ds-nav-item
        routerLink="/dashboard"
        routerLinkActive="is-active"
        icon="home"
        [label]="'navbar.home' | t"
        (click)="close()"
      />
      <ds-nav-item
        routerLink="/diary"
        routerLinkActive="is-active"
        icon="diary"
        [label]="'navbar.diary' | t"
        (click)="close()"
      />
      <ds-nav-item
        routerLink="/menus"
        routerLinkActive="is-active"
        icon="menuboard"
        [label]="'navbar.menus' | t"
        (click)="close()"
      />
      <ds-nav-item
        routerLink="/agenda"
        routerLinkActive="is-active"
        icon="agenda"
        [label]="'navbar.agenda' | t"
        (click)="close()"
      />
      <ds-nav-item
        routerLink="/economy"
        routerLinkActive="is-active"
        icon="wallet"
        [label]="'navbar.economy' | t"
        (click)="close()"
      />
      <ds-nav-item
        routerLink="/catalog"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        icon="leaf"
        [label]="'navbar.catalog' | t"
        (click)="close()"
      />
      <ds-nav-item
        routerLink="/global-catalog"
        routerLinkActive="is-active"
        [sub]="true"
        icon="download"
        [label]="'navbar.import' | t"
        (click)="close()"
      />
      <ds-nav-item
        routerLink="/recipes"
        routerLinkActive="is-active"
        icon="chefHat"
        [label]="'navbar.recipes' | t"
        (click)="close()"
      />
      <ds-nav-item
        routerLink="/shopping-list"
        routerLinkActive="is-active"
        icon="cart"
        [label]="'navbar.list' | t"
        (click)="close()"
      />
      <ds-nav-item
        routerLink="/gym"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        icon="dumbbell"
        [label]="'navbar.gym' | t"
        (click)="close()"
      />
      <ds-nav-item
        routerLink="/gym/exercises"
        routerLinkActive="is-active"
        [sub]="true"
        icon="dumbbell"
        [label]="'navbar.exercises' | t"
        (click)="close()"
      />
      <ds-nav-item
        routerLink="/gym/history"
        routerLinkActive="is-active"
        [sub]="true"
        icon="history"
        [label]="'navbar.history' | t"
        (click)="close()"
      />
      @if (isGod()) {
        <ds-nav-item
          routerLink="/users"
          routerLinkActive="is-active"
          icon="users"
          [label]="'navbar.users' | t"
          badge="ADMIN"
          (click)="close()"
        />
        <ds-nav-item
          icon="chart"
          [href]="grafanaUrl"
          [external]="false"
          [label]="'navbar.logs' | t"
          badge="ADMIN"
          (click)="close()"
        />
      }
    </nav>

    <ds-divider class="drawer__rule drawer__rule--bottom" />

    <button
      type="button"
      class="drawer__theme"
      role="switch"
      [attr.aria-checked]="isDark()"
      (click)="toggleTheme()"
    >
      <ds-icon
        class="drawer__theme-icon"
        [class.drawer__theme-icon--moon]="isDark()"
        [class.drawer__theme-icon--sun]="!isDark()"
        [name]="isDark() ? 'moon' : 'sun'"
        [size]="18"
        [stroke]="2.1"
      />
      <span class="drawer__theme-label">{{ "navbar.darkMode" | t }}</span>
      <span class="drawer__switch" [class.is-on]="isDark()">
        <span class="drawer__switch-knob"></span>
      </span>
    </button>

    <button type="button" class="drawer__logout" (click)="logout()">
      <ds-icon name="logout" [size]="17" [stroke]="2.2" />
      <span>{{ "navbar.logout" | t }}</span>
    </button>
  </aside>
</div>
