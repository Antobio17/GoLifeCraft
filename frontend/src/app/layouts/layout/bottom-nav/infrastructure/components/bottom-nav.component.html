<nav
  data-testid="bottom-nav"
  class="tabbar"
  aria-label="Principal"
  [class.tabbar--drawer-open]="isDrawerOpen()"
  [class.tabbar--compact]="compact()"
>
  <ng-content></ng-content>

  <ds-stack class="tabbar__row" direction="row" align="stretch" gap="0">
    <ds-scroll-row
      #track
      class="tabbar__track"
      (transitionend)="scrollActiveIntoView()"
    >
      @for (item of items; track item.route) {
        <ds-tab-item
          [attr.data-testid]="'nav-' + item.route"
          [routerLink]="item.route"
          [class.is-active]="activeRoute() === item.route"
          [icon]="item.icon"
          [label]="item.labelKey | t"
          [active]="activeRoute() === item.route && !isDrawerOpen()"
          [compact]="compact()"
          [live]="liveRoute() === item.route"
          [attr.aria-label]="item.labelKey | t"
        />
      }
    </ds-scroll-row>

    <ds-tab-item
      data-testid="nav-menu"
      class="tabbar__pinned"
      icon="menu"
      [label]="'navbar.menu' | t"
      [active]="isDrawerOpen()"
      [compact]="compact()"
      [attr.aria-label]="'navbar.openMenu' | t"
      (click)="toggleDrawer()"
    />
  </ds-stack>
</nav>
