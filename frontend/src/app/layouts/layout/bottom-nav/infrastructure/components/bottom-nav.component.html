<nav
  data-testid="bottom-nav"
  class="tabbar"
  aria-label="Principal"
  [class.tabbar--hidden]="hidden()"
>
  <ds-stack
    class="tabbar__row"
    direction="row"
    align="stretch"
    gap="var(--ds-space-2)"
  >
    <ds-stack class="tabbar__pill" direction="row" align="center" gap="0">
      @for (item of items; track item.route) {
        <ds-tab-item
          [attr.data-testid]="'nav-' + item.route"
          [routerLink]="item.route"
          [icon]="item.icon"
          [active]="activeRoute() === item.route && !isDrawerOpen()"
          [attr.aria-label]="item.labelKey | t"
          [attr.aria-current]="activeRoute() === item.route ? 'page' : null"
        />
      }

      <ds-tab-item
        data-testid="nav-menu"
        icon="menu"
        [active]="isDrawerOpen()"
        [attr.aria-label]="'navbar.openMenu' | t"
        [attr.aria-expanded]="isDrawerOpen()"
        (click)="toggleDrawer()"
      />
    </ds-stack>

    <ng-content></ng-content>
  </ds-stack>
</nav>
