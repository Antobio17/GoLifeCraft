<nav class="tabbar" aria-label="Principal">
  @for (item of items; track item.route) {
    <ds-tab-item
      [routerLink]="item.route"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: item.exact }"
      #itemActive="routerLinkActive"
      [icon]="item.icon"
      [label]="item.labelKey | t"
      [active]="itemActive.isActive && !isDrawerOpen()"
      [attr.aria-label]="item.labelKey | t"
    />
  }

  <ds-tab-item
    icon="menu"
    [label]="'navbar.menu' | t"
    [active]="isDrawerOpen()"
    [attr.aria-label]="'navbar.openMenu' | t"
    (click)="toggleDrawer()"
  />
</nav>
