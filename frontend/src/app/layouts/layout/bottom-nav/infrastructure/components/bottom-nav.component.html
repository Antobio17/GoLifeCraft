<nav
  class="tabbar"
  aria-label="Principal"
  [class.tabbar--drawer-open]="isDrawerOpen()"
>
  <ds-scroll-row
    #track
    class="tabbar__track"
    (transitionend)="scrollActiveIntoView()"
  >
    @for (item of items; track item.route) {
      <ds-tab-item
        [routerLink]="item.route"
        [class.is-active]="activeRoute() === item.route"
        [icon]="item.icon"
        [label]="item.labelKey | t"
        [active]="activeRoute() === item.route && !isDrawerOpen()"
        [attr.aria-label]="item.labelKey | t"
      />
    }
  </ds-scroll-row>

  <ds-tab-item
    class="tabbar__pinned"
    icon="menu"
    [label]="'navbar.menu' | t"
    [active]="isDrawerOpen()"
    [attr.aria-label]="'navbar.openMenu' | t"
    (click)="toggleDrawer()"
  />
</nav>
