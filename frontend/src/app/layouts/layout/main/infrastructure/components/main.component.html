<div class="app-frame" [class.app-frame--with-tabbar]="showTabBar()">
  <app-floating-toast></app-floating-toast>

  @if (impersonation(); as active) {
    <ds-impersonation-bar
      [label]="'impersonation.bar.label' | t"
      [name]="active.name"
      [exitLabel]="'impersonation.bar.exit' | t"
      [exitAriaLabel]="'impersonation.bar.exitAria' | t"
      (exited)="exitImpersonation()"
    ></ds-impersonation-bar>
  }

  <div class="app-frame__content" [attr.data-module]="module()">
    <router-outlet></router-outlet>
  </div>

  @if (showTabBar()) {
    <app-bottom-nav [attr.data-module]="navModule()">
      <app-active-workout-banner></app-active-workout-banner>
    </app-bottom-nav>
    <app-side-drawer [attr.data-module]="navModule()"></app-side-drawer>
  }
</div>
