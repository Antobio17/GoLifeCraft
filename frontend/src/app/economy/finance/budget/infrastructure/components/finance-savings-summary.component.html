<ds-stack dsReveal [gap]="'var(--ds-space-2)'">
  <ds-section-header
    [title]="'dashboard.savings.title' | t"
    [actionLabel]="'dashboard.savings.seeAll' | t"
    (action)="seeAll.emit()"
  />

  @if (loading()) {
    <ds-skeleton-panel [figure]="true" content="meters" />
  } @else if (!configured()) {
    <ds-text variant="muted">{{ "dashboard.savings.empty" | t }}</ds-text>
  } @else {
    <ds-card [padding]="'var(--ds-space-4)'">
      <ds-stack
        direction="row"
        justify="between"
        align="center"
        [gap]="'var(--ds-space-2)'"
      >
        <ds-text variant="label">{{ "dashboard.savings.eyebrow" | t }}</ds-text>

        <ds-chip
          [tone]="savingsTone() === 'positive' ? 'brand' : 'warning'"
          [uppercase]="true"
          >{{ savingsBadgeLabel() }}</ds-chip
        >
      </ds-stack>

      <ds-stack
        direction="row"
        align="end"
        [gap]="'var(--ds-space-2)'"
        [wrap]="true"
      >
        <ds-heading [level]="3" size="lg">{{ savingsRealLabel() }}</ds-heading>
        <ds-text variant="meta"
          >{{ "dashboard.savings.goal" | t }}
          {{ savingsObjectiveLabel() }}</ds-text
        >
      </ds-stack>

      <ds-budget-meter
        [ratio]="savingsRatio()"
        [paceRatio]="monthProgressRatio()"
        [tone]="savingsTone()"
        [ariaLabel]="'dashboard.savings.eyebrow' | t"
      />

      <ds-text [variant]="savingsGoalReached() ? 'success' : 'meta'">{{
        savingsRemainingLabel()
      }}</ds-text>
    </ds-card>
  }
</ds-stack>
