<ds-stack dsReveal [gap]="'var(--ds-space-2)'">
  <ds-section-header
    [title]="'dashboard.savings.title' | t"
    [actionLabel]="'dashboard.savings.seeAll' | t"
    (action)="seeAll.emit()"
  />

  @if (loading()) {
    <ds-module-card>
      <ds-stack [gap]="'var(--ds-space-3)'">
        <ds-skeleton-line width="40%" height="0.75rem" />
        <ds-skeleton-line width="55%" height="1.5rem" />
        <ds-skeleton-line width="100%" height="0.75rem" />
        <ds-skeleton-line width="100%" height="3.25rem" />
      </ds-stack>
    </ds-module-card>
  } @else if (!configured()) {
    <ds-cta-row
      icon="wallet"
      [dashed]="true"
      [title]="'dashboard.savings.emptyTitle' | t"
      [subtitle]="'dashboard.savings.empty' | t"
      (clicked)="seeAll.emit()"
    />
  } @else {
    <ds-module-card [eyebrow]="'dashboard.savings.eyebrow' | t">
      <ds-chip
        slot="aside"
        [tone]="savingsTone() === 'positive' ? 'brand' : 'warning'"
        [uppercase]="true"
        >{{ savingsBadgeLabel() }}</ds-chip
      >

      <ds-heading [level]="3" size="xl" [truncate]="true">{{
        savedLabel()
      }}</ds-heading>

      <ds-budget-meter
        [ratio]="savingsRatio()"
        [paceRatio]="monthProgressRatio()"
        [tone]="savingsTone()"
        [ariaLabel]="'dashboard.savings.eyebrow' | t"
      />

      <ds-stat-strip [compact]="true" [items]="statItems()" />
    </ds-module-card>
  }
</ds-stack>
