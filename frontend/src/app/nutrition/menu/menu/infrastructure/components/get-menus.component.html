<ds-page-wrapper [gap]="'var(--ds-space-3)'">
  <ds-screen-header
    [leading]="'back'"
    [leadingLabel]="'getMenus.back' | t"
    (leadingClick)="goBack()"
    [eyebrow]="'getMenus.eyebrow' | t"
    [title]="'getMenus.title' | t"
    [subtitle]="headerSubtitle()"
  >
    <ds-button
      slot="actions"
      variant="primary"
      size="icon-lg"
      icon="plus"
      [iconSize]="19"
      [ariaLabel]="'getMenus.create' | t"
      (clicked)="openTypeSheet()"
    />
  </ds-screen-header>

  @if (loading()) {
    <ds-skeleton-filters [search]="true" [caption]="true" />
    <ds-skeleton-list
      [count]="4"
      [columns]="null"
      minColumn="20rem"
      [gap]="'var(--ds-space-2)'"
      radius="var(--ds-radius-surface)"
      padding="var(--ds-space-4)"
      titleWidth="52%"
      metaWidth="70%"
      trailing="actions"
      [actions]="2"
    />
  } @else if (isEmpty()) {
    <ds-empty-state
      icon="menuboard"
      [title]="'getMenus.empty.title' | t"
      [text]="'getMenus.hint' | t"
    />
  } @else {
    <ds-search-input
      [placeholder]="'getMenus.searchPlaceholder' | t"
      [clearLabel]="'getMenus.searchClear' | t"
      [value]="searchQuery()"
      (searched)="onSearch($event)"
    />

    @if (!hasResults()) {
      <ds-text variant="muted">
        {{ "getMenus.noResults" | t }} “{{ searchQuery() }}”
      </ds-text>
    } @else {
      @for (group of groups(); track group.key) {
        <ds-section-header
          [title]="group.label"
          [staticLabel]="group.countLabel"
        />

        <ds-grid
          dsReveal="children"
          [minColumn]="'20rem'"
          [gap]="'var(--ds-space-2)'"
        >
          @for (card of group.cards; track card.id) {
            <ds-menu-card
              data-testid="menu-card"
              [name]="card.name"
              [meta]="card.meta"
              [protein]="card.protein"
              [fat]="card.fat"
              [carbs]="card.carbs"
              [macrosLabel]="card.macrosLabel"
              [macroLabels]="macroLabels()"
              [loadLabel]="card.loadLabel"
              [loadInMenu]="card.isWeek"
              [loadIcon]="card.isWeek ? 'calendar' : 'download'"
              [moreLabel]="'getMenus.card.more' | t"
              [shopLabel]="'getMenus.card.shop' | t"
              [exportLabel]="'getMenus.card.export' | t"
              (activated)="onOpen(card)"
              (loaded)="onLoad(card)"
              (shopped)="onShop(card.id)"
              (exported)="onExport(card.id)"
            />
          }
        </ds-grid>
      }
    }
  }

  <ds-modal-sheet
    [open]="typeSheetOpen()"
    [title]="'getMenus.newType.title' | t"
    [closeLabel]="'getMenus.newType.close' | t"
    (closed)="closeTypeSheet()"
  >
    <ds-stack [gap]="'var(--ds-space-2)'">
      <ds-text variant="meta">{{ "getMenus.newType.subtitle" | t }}</ds-text>

      <ds-choice-row
        glyph="cloche"
        [title]="'getMenus.newType.singleTitle' | t"
        [description]="'getMenus.newType.singleText' | t"
        (activated)="onCreate('single')"
      />

      <ds-choice-row
        glyph="calendarWeek"
        [title]="'getMenus.newType.weekTitle' | t"
        [description]="'getMenus.newType.weekText' | t"
        (activated)="onCreate('week')"
      />
    </ds-stack>
  </ds-modal-sheet>

  <app-menu-load-sheet
    [menuId]="loadSheetMenuId()"
    (closed)="closeLoadSheet()"
  />

  <app-menu-apply-week-sheet
    [menuId]="applyWeekMenuId()"
    (closed)="closeApplyWeekSheet()"
  />

  <app-menu-shopping-sheet
    [menuId]="shoppingMenuId()"
    (closed)="closeShoppingSheet()"
  />
</ds-page-wrapper>
