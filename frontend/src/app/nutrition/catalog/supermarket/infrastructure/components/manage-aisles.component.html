<ds-modal-sheet
  [open]="isOpen()"
  [compact]="true"
  [title]="title()"
  [closeLabel]="closeLabel()"
  (closed)="onClose()"
>
  <ds-stack [gap]="'var(--ds-space-3)'">
    <ds-stack
      direction="row"
      align="center"
      justify="between"
      [gap]="'var(--ds-space-2)'"
    >
      <ds-text variant="meta">{{ subtitle() }}</ds-text>
      <ds-save-status
        align="end"
        [status]="autosave.status()"
        (retried)="onRetrySave()"
      />
    </ds-stack>

    @if (!hasStores()) {
      <ds-text variant="muted">{{ noStoresText() }}</ds-text>
    } @else {
      <ds-store-tabs
        [tabs]="storeTabs()"
        [active]="activeStore()"
        (selected)="onSelectStore($event)"
      />

      <ds-aisle-list
        [items]="activeAisles()"
        [emptyText]="emptyText()"
        [removeLabel]="removeLabel()"
        [editLabel]="editLabel()"
        [saveLabel]="saveEditLabel()"
        [cancelLabel]="cancelEditLabel()"
        [namePlaceholder]="placeholder()"
        [moveUpLabel]="moveUpLabel()"
        [moveDownLabel]="moveDownLabel()"
        (moved)="onMove($event)"
        (removed)="onRemove($event)"
        (renamed)="onRename($event)"
      />

      <ds-stack direction="row" align="center" [gap]="'var(--ds-space-2)'">
        <ds-stack [grow]="true">
          <ds-text-input
            variant="outlined"
            [placeholder]="placeholder()"
            [ngModel]="newAisleName()"
            [ngModelOptions]="{ standalone: true }"
            (ngModelChange)="onNameChange($event)"
          />
        </ds-stack>

        <ds-button icon="plus" (clicked)="onAdd()">{{ addLabel() }}</ds-button>
      </ds-stack>
    }
  </ds-stack>
</ds-modal-sheet>
