<ds-page-wrapper
  [maxWidth]="'40rem'"
  [wideMaxWidth]="'64rem'"
  [gap]="'var(--ds-space-3)'"
>
  @if (loading()) {
    <ds-skeleton-screen-header
      [leading]="true"
      [eyebrow]="true"
      [subtitle]="false"
      titleWidth="46%"
      [actions]="1"
    />
    <ds-split-view [columns]="'minmax(0, 0.8fr) minmax(0, 1fr)'">
      <ds-skeleton-hero slot="side" />

      <ds-rail [indent]="'var(--ds-space-8)'" [gap]="'var(--ds-space-5)'">
        <ds-stack [gap]="'var(--ds-space-2)'">
          <ds-skeleton-section-header titleWidth="8rem" [count]="true" />
          <ds-skeleton-list
            [count]="3"
            [gap]="'var(--ds-space-3)'"
            [tile]="40"
            titleWidth="54%"
            metaWidth="40%"
            trailing="pill"
          />
        </ds-stack>
      </ds-rail>
    </ds-split-view>
  } @else if (production()) {
    <ds-screen-header
      [sticky]="true"
      [leading]="'back'"
      [leadingLabel]="'getProduction.back' | t"
      [eyebrow]="statusLabel()"
      [title]="rangeLabel()"
      (leadingClick)="onBack()"
    >
      <ds-stack slot="actions" direction="row" [gap]="'var(--ds-space-2)'">
        <ds-button
          variant="secondary"
          size="icon-lg"
          icon="trash"
          [iconSize]="19"
          [ariaLabel]="'getProduction.discard' | t"
          (clicked)="onDiscard()"
        />
      </ds-stack>
    </ds-screen-header>

    <ds-split-view [columns]="'minmax(0, 0.8fr) minmax(0, 1fr)'">
      <ds-module-card
        slot="side"
        data-testid="production-detail-hero"
        [hero]="true"
        [eyebrow]="heroKicker()"
      >
        <ds-stack [gap]="'var(--ds-space-1-5)'">
          <ds-big-figure
            [value]="heroServings()"
            [suffix]="'getProduction.hero.servings' | t"
          />
          <ds-text variant="meta">{{ summary() }}</ds-text>
        </ds-stack>

        <ds-stack [gap]="'var(--ds-space-2)'">
          <ds-bar-chart
            class="hero-bars"
            [bars]="bars()"
            [height]="72"
            [showValues]="true"
          />
          <ds-text variant="meta">{{ "getProduction.hero.chart" | t }}</ds-text>
        </ds-stack>
      </ds-module-card>

      <ds-rail [indent]="'var(--ds-space-8)'" [gap]="'var(--ds-space-5)'">
        @for (group of groups(); track group.key) {
          <ds-stack class="production-day" [gap]="'var(--ds-space-1)'">
            <ds-section-header
              [title]="group.title"
              [caption]="group.caption"
              [staticLabel]="group.total"
            />

            <ds-stack dsReveal="children">
              @for (row of group.rows; track row.item.itemId) {
                <ds-pressable
                  class="production-row"
                  data-testid="production-detail-row"
                  [gap]="'var(--ds-space-4)'"
                  [class.is-done]="row.done"
                  [ariaLabel]="row.ariaLabel"
                  (press)="onOpen(row.item)"
                >
                  <ds-emoji-tile
                    [emoji]="row.item.emoji"
                    [imageUrl]="row.imageUrl"
                    [alt]="row.item.name"
                    [size]="40"
                  />

                  <ds-stack
                    class="production-row__body"
                    [gap]="'2px'"
                    [grow]="true"
                  >
                    <ds-text variant="strong">{{ row.item.name }}</ds-text>
                    <ds-text variant="meta">{{ row.meta }}</ds-text>
                  </ds-stack>

                  <ds-chip
                    class="production-row__amount"
                    [tone]="row.done ? 'brand' : 'accent'"
                  >
                    @if (row.done) {
                      <ds-icon name="check" [size]="12" [stroke]="3" />
                    }
                    {{ row.amount }}
                    @if (!row.done) {
                      <ds-icon name="chevronRight" [size]="12" [stroke]="2.6" />
                    }
                  </ds-chip>
                </ds-pressable>
              }
            </ds-stack>
          </ds-stack>
        }
      </ds-rail>
    </ds-split-view>
  } @else {
    <ds-empty-state
      icon="alertCircle"
      [title]="'getProduction.error.title' | t"
      [text]="'getProduction.error.text' | t"
    />
  }
</ds-page-wrapper>

<ds-confirm-action-modal
  [show]="showDiscardModal()"
  [title]="'getProduction.discardModal.title' | t"
  [body]="'getProduction.discardModal.body' | t"
  [itemName]="rangeLabel()"
  [warningText]="'getProduction.discardModal.warning' | t"
  [isDeleting]="discarding()"
  [cancelLabel]="'getProduction.discardModal.cancel' | t"
  [confirmLabel]="'getProduction.discardModal.confirm' | t"
  [deletingLabel]="'getProduction.discardModal.deleting' | t"
  (confirmed)="onConfirmDiscard()"
  (cancelled)="onCancelDiscard()"
/>
