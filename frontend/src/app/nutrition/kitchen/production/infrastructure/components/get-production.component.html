<ds-page-wrapper
  [maxWidth]="'40rem'"
  [wideMaxWidth]="'60rem'"
  [gap]="'var(--ds-space-3)'"
>
  @if (loading()) {
    <ds-skeleton-screen-header
      [leading]="true"
      [eyebrow]="true"
      [subtitle]="false"
      titleWidth="46%"
      [actions]="1"
    />
    <ds-skeleton-list
      [count]="3"
      [gap]="'var(--ds-space-2)'"
      radius="var(--ds-radius-xl)"
      padding="var(--ds-space-3)"
      [tile]="44"
      [tileRadius]="12"
      titleWidth="52%"
      metaWidth="40%"
      trailing="pill"
    />
  } @else if (production(); as detail) {
    <ds-screen-header
      [leading]="'back'"
      [leadingLabel]="'getProduction.back' | t"
      [eyebrow]="statusLabel()"
      [title]="rangeLabel()"
      (leadingClick)="onBack()"
    >
      <ds-stack slot="actions" direction="row" [gap]="'var(--ds-space-2)'">
        <ds-button
          variant="secondary"
          size="icon-lg"
          icon="trash"
          [iconSize]="19"
          [ariaLabel]="'getProduction.discard' | t"
          (clicked)="onDiscard()"
        />
      </ds-stack>
    </ds-screen-header>

    <ds-split-view [columns]="'minmax(0, 0.7fr) minmax(0, 1fr)'">
      <ds-stack slot="side" [gap]="'var(--ds-space-2)'">
        <ds-text variant="meta">{{ summary() }}</ds-text>
        <ds-stack direction="row" [wrap]="true" [gap]="'var(--ds-space-1-5)'">
          <ds-chip [tone]="cooking() ? 'brand' : 'neutral'">{{
            statusLabel()
          }}</ds-chip>
          @if (cooking()) {
            <ds-chip>{{
              "getProduction.pending" | t: { pending: pendingCount() }
            }}</ds-chip>
          }
        </ds-stack>
      </ds-stack>

      <ds-section-header
        [title]="'getProduction.recipes' | t"
        [staticLabel]="detail.items.length.toString()"
      />

      <ds-stack dsReveal="children" [gap]="'var(--ds-space-2)'">
        @for (row of rows(); track row.item.itemId) {
          <ds-production-row
            [state]="
              row.done ? ProductionRowState.Done : ProductionRowState.Deficit
            "
            [interactive]="true"
            [emoji]="row.item.emoji"
            [name]="row.item.name"
            [meta]="row.meta"
            [tag]="row.origin"
            [doneLabel]="'getProduction.row.done' | t"
            (opened)="onOpen(row.item)"
          />
        }
      </ds-stack>
    </ds-split-view>
  } @else {
    <ds-empty-state
      icon="alertCircle"
      [title]="'getProduction.error.title' | t"
      [text]="'getProduction.error.text' | t"
    />
  }
</ds-page-wrapper>

<ds-confirm-action-modal
  [show]="showDiscardModal()"
  [title]="'getProduction.discardModal.title' | t"
  [body]="'getProduction.discardModal.body' | t"
  [itemName]="rangeLabel()"
  [warningText]="'getProduction.discardModal.warning' | t"
  [isDeleting]="discarding()"
  [cancelLabel]="'getProduction.discardModal.cancel' | t"
  [confirmLabel]="'getProduction.discardModal.confirm' | t"
  [deletingLabel]="'getProduction.discardModal.deleting' | t"
  (confirmed)="onConfirmDiscard()"
  (cancelled)="onCancelDiscard()"
/>
