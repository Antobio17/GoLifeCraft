<ds-page-wrapper [gap]="'var(--ds-space-3)'">
  <ds-screen-header
    [title]="'getPantryLocations.title' | t"
    [subtitle]="headerSubtitle()"
  >
    <ds-button
      slot="actions"
      variant="primary"
      size="icon-lg"
      icon="plus"
      [iconSize]="19"
      [ariaLabel]="'getPantryLocations.new' | t"
      (clicked)="onCreate()"
    />
  </ds-screen-header>

  @if (loading()) {
    <ds-skeleton-filters [search]="true" />
    <ng-container
      [ngTemplateOutlet]="locationSkeleton"
      [ngTemplateOutletContext]="{ $implicit: 6 }"
    />
  } @else {
    <ds-search-input
      [placeholder]="'getPantryLocations.searchPlaceholder' | t"
      [clearLabel]="'getPantryLocations.searchClear' | t"
      [value]="searchQuery()"
      (searched)="onSearch($event)"
    />

    @if (reloading()) {
      <ng-container
        [ngTemplateOutlet]="locationSkeleton"
        [ngTemplateOutletContext]="{ $implicit: 6 }"
      />
    } @else if (rows().length === 0) {
      @if (searchQuery()) {
        <ds-text variant="muted">
          {{ "getPantryLocations.noResults" | t }} “{{ searchQuery() }}”
        </ds-text>
      } @else {
        <ds-empty-state
          icon="home"
          [title]="'getPantryLocations.empty.title' | t"
          [text]="'getPantryLocations.empty.text' | t"
        />
      }
    } @else {
      <ds-grid dsReveal="children" [minColumn]="'18.75rem'">
        @for (row of rows(); track row.id) {
          <ds-location-card
            [emoji]="row.emoji"
            [name]="row.name"
            [description]="row.description"
            [badges]="row.badges"
            (activated)="onOpen(row.id)"
          >
            <ds-icon-button
              slot="actions"
              icon="pencil"
              color="var(--ds-text-meta)"
              [ariaLabel]="'getPantryLocations.actions.edit' | t"
              (clicked)="onEdit(row.id)"
            />
            <ds-icon-button
              slot="actions"
              icon="trash"
              color="var(--ds-danger)"
              [ariaLabel]="'getPantryLocations.actions.delete' | t"
              (clicked)="onDelete(row.location)"
            />
          </ds-location-card>
        }
      </ds-grid>

      @if (loadingMore()) {
        <ng-container
          [ngTemplateOutlet]="locationSkeleton"
          [ngTemplateOutletContext]="{ $implicit: 2 }"
        />
      }

      <ds-infinite-scroll
        [disabled]="loadingMore() || !hasMore()"
        (reached)="loadMore()"
      />
    }
  }
</ds-page-wrapper>

<ng-template #locationSkeleton let-count>
  <ds-skeleton-list
    [count]="count"
    [columns]="null"
    minColumn="18.75rem"
    [gap]="'var(--ds-space-3)'"
    radius="var(--ds-radius-xl)"
    padding="var(--ds-space-2)"
    [alignTop]="true"
    [tile]="56"
    [tileRadius]="12"
    titleWidth="54%"
    metaWidth="48%"
    trailing="actions"
    [actions]="2"
    [chips]="2"
  />
</ng-template>

<ds-confirm-action-modal
  [show]="showDeleteModal()"
  [title]="'getPantryLocations.deleteTitle' | t"
  [body]="'getPantryLocations.deleteBody' | t"
  [itemName]="locationToDeleteName()"
  [warningText]="'getPantryLocations.deleteWarning' | t"
  [isDeleting]="deleting()"
  [cancelLabel]="'getPantryLocations.cancel' | t"
  [confirmLabel]="'getPantryLocations.deleteConfirm' | t"
  [deletingLabel]="'getPantryLocations.deleting' | t"
  (confirmed)="onConfirmDelete()"
  (cancelled)="onCancelDelete()"
/>
