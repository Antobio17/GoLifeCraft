<ds-page-wrapper [maxWidth]="'40rem'" [gap]="'var(--ds-space-5)'">
  <ds-screen-header
    [sticky]="true"
    [leading]="'close'"
    [leadingLabel]="'updatePantryLocation.back' | t"
    [title]="'updatePantryLocation.title' | t"
    [subtitle]="'updatePantryLocation.description' | t"
    (leadingClick)="cancel()"
  >
    <ds-button
      slot="actions"
      data-testid="editor-submit"
      type="button"
      variant="primary"
      size="icon-lg"
      icon="save"
      [iconSize]="19"
      [ariaLabel]="'updatePantryLocation.save' | t"
      [disabled]="!draft.hasChanges()"
      [loading]="saving()"
      (clicked)="save()"
    />
  </ds-screen-header>

  @if (loading()) {
    <ds-skeleton-fields [rows]="[1, 1, 1]" />
  } @else {
    <form dsEditorForm [formGroup]="form" (ngSubmit)="onSubmit()">
      <ds-stack [gap]="'var(--ds-space-5)'">
        <ds-field
          [label]="'updatePantryLocation.field.name' | t"
          [required]="true"
        >
          <ds-text-input
            variant="outlined"
            formControlName="name"
            [maxLength]="60"
            [placeholder]="'updatePantryLocation.field.namePlaceholder' | t"
          />
        </ds-field>

        <ds-field [label]="'updatePantryLocation.field.emoji' | t">
          <ds-choice-chips
            formControlName="emoji"
            [options]="kindOptions()"
            [wrap]="true"
          />
        </ds-field>

        <ds-field
          [label]="'updatePantryLocation.field.locationDescription' | t"
          [hint]="'updatePantryLocation.field.descriptionHint' | t"
          [hintIcon]="true"
        >
          <ds-text-input
            variant="outlined"
            formControlName="description"
            [maxLength]="255"
            [placeholder]="
              'updatePantryLocation.field.descriptionPlaceholder' | t
            "
          />
        </ds-field>
      </ds-stack>
    </form>
  }
</ds-page-wrapper>

<ds-discard-changes-modal
  [show]="draft.confirmingDiscard()"
  (confirmed)="draft.discard()"
  (cancelled)="draft.keepEditing()"
/>
