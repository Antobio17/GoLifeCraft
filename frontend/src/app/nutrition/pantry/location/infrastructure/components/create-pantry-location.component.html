<ds-page-wrapper [maxWidth]="'40rem'" [gap]="'var(--ds-space-5)'">
  <ds-screen-header
    [sticky]="true"
    [leading]="'close'"
    [leadingLabel]="'createPantryLocation.back' | t"
    [title]="'createPantryLocation.title' | t"
    [subtitle]="'createPantryLocation.description' | t"
    (leadingClick)="cancel()"
  >
    <ds-button
      slot="actions"
      data-testid="editor-submit"
      type="button"
      variant="primary"
      size="icon-lg"
      icon="save"
      [iconSize]="19"
      [ariaLabel]="'createPantryLocation.save' | t"
      [disabled]="!draft.hasChanges()"
      [loading]="saving()"
      (clicked)="save()"
    />
  </ds-screen-header>

  @if (loading()) {
    <ds-skeleton-fields [rows]="[1, 1, 1]" />
  } @else {
    <form dsEditorForm [formGroup]="form" (ngSubmit)="onSubmit()">
      <ds-stack [gap]="'var(--ds-space-5)'">
        <ds-stack direction="row" align="end" [gap]="'var(--ds-space-3)'">
          <ds-field [label]="'createPantryLocation.field.emoji' | t">
            <ds-emoji-picker
              formControlName="emoji"
              [groups]="emojiGroups"
              [fallback]="fallbackEmoji"
              [sheetTitle]="'createPantryLocation.field.emojiSheetTitle' | t"
              [closeLabel]="'createPantryLocation.field.emojiClose' | t"
              [triggerLabel]="'createPantryLocation.field.emojiTrigger' | t"
              [searchPlaceholder]="'createPantryLocation.field.emojiSearch' | t"
              [emptyLabel]="'createPantryLocation.field.emojiEmpty' | t"
            />
          </ds-field>

          <ds-field
            [grow]="true"
            [label]="'createPantryLocation.field.name' | t"
            [required]="true"
          >
            <ds-text-input
              variant="outlined"
              formControlName="name"
              [maxLength]="60"
              [placeholder]="'createPantryLocation.field.namePlaceholder' | t"
            />
          </ds-field>
        </ds-stack>

        <ds-field
          [label]="'createPantryLocation.field.locationDescription' | t"
          [hint]="'createPantryLocation.field.descriptionHint' | t"
          [hintIcon]="true"
        >
          <ds-text-input
            variant="outlined"
            formControlName="description"
            [maxLength]="255"
            [placeholder]="
              'createPantryLocation.field.descriptionPlaceholder' | t
            "
          />
        </ds-field>
      </ds-stack>
    </form>
  }
</ds-page-wrapper>

<ds-discard-changes-modal
  [show]="draft.confirmingDiscard()"
  (confirmed)="draft.discard()"
  (cancelled)="draft.keepEditing()"
/>
