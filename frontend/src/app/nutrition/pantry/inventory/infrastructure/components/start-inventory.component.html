<ds-page-wrapper [maxWidth]="'40rem'" [gap]="'var(--ds-space-5)'">
  <ds-screen-header
    [leading]="'close'"
    [leadingLabel]="'startInventory.back' | t"
    [title]="'startInventory.title' | t"
    [subtitle]="'startInventory.description' | t"
    (leadingClick)="cancel()"
  />

  @if (loading()) {
    <ds-skeleton-fields [rows]="[1, 1, 1]" />
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <ds-stack [gap]="'var(--ds-space-5)'">
        <ds-field
          [label]="'startInventory.field.countedOn' | t"
          [required]="true"
        >
          <ds-date-input formControlName="countedOn" />
        </ds-field>

        <ds-field
          [label]="'startInventory.field.shift' | t"
          [hint]="'startInventory.field.shiftHint' | t"
          [hintIcon]="true"
          [required]="true"
        >
          <ds-segmented-toggle
            formControlName="shift"
            [options]="shiftOptions()"
          />
        </ds-field>

        <ds-note
          [icon]="hasNothingToCount() ? 'alertCircle' : 'package'"
          [tone]="hasNothingToCount() ? 'warning' : 'info'"
        >
          {{ scopeLabel() }}
        </ds-note>

        <ds-field
          [label]="'startInventory.field.note' | t"
          [hint]="'startInventory.field.noteHint' | t"
          [hintIcon]="true"
        >
          <ds-text-input
            variant="outlined"
            formControlName="note"
            [maxLength]="255"
            [placeholder]="'startInventory.field.notePlaceholder' | t"
          />
        </ds-field>

        <ds-note>{{ "startInventory.explanation" | t }}</ds-note>

        <ds-button
          type="submit"
          variant="soft"
          [fullWidth]="true"
          [loading]="saving()"
          [disabled]="saving() || hasNothingToCount()"
        >
          {{
            saving()
              ? ("startInventory.saving" | t)
              : ("startInventory.save" | t)
          }}
        </ds-button>
      </ds-stack>
    </form>
  }
</ds-page-wrapper>
