<ds-page-wrapper [gap]="'var(--ds-space-3)'">
  @if (loading()) {
    <ds-skeleton-screen-header
      [leading]="true"
      [eyebrow]="true"
      [subtitle]="true"
      titleWidth="46%"
      [actions]="1"
    />

    <ds-split-view [columns]="'minmax(0, 0.8fr) minmax(0, 1.2fr)'">
      <ng-container slot="side">
        <ds-skeleton height="10rem" />
      </ng-container>
      <ds-stack [gap]="'var(--ds-space-3)'">
        <ds-skeleton height="5rem" />
        <ds-skeleton height="5rem" delay="0.1s" />
        <ds-skeleton height="5rem" delay="0.2s" />
      </ds-stack>
    </ds-split-view>
  }

  @if (!loading() && attributes(); as inventory) {
    <ds-screen-header
      [leading]="'back'"
      [leadingLabel]="'getInventory.back' | t"
      [eyebrow]="'getInventory.eyebrow' | t"
      [title]="dateLabel()"
      [subtitle]="headerSubtitle()"
      (leadingClick)="back()"
    >
      @if (isDraft()) {
        <ds-button
          slot="actions"
          variant="danger"
          size="icon-lg"
          icon="trash"
          [iconSize]="19"
          [ariaLabel]="'getInventory.discard' | t"
          (clicked)="onDiscard()"
        />
      }
    </ds-screen-header>

    <ds-split-view [columns]="'minmax(0, 0.8fr) minmax(0, 1.2fr)'">
      <ng-container slot="side">
        <ds-card [padding]="'var(--ds-space-3)'" [gap]="'var(--ds-space-2)'">
          <ds-macro-badges [macros]="summaryBadges()" />
          <ds-progress-bar [value]="progressPercent()" />

          @if (inventory.note) {
            <ds-text variant="meta">{{ inventory.note }}</ds-text>
          }

          <ds-text variant="meta">{{ hint() }}</ds-text>

          @if (isDraft()) {
            <ds-button
              variant="primary"
              [fullWidth]="true"
              [loading]="validating()"
              (clicked)="onValidate()"
            >
              {{ "getInventory.validate" | t }}
            </ds-button>
          }
        </ds-card>
      </ng-container>

      <ds-stack [gap]="'var(--ds-space-2)'">
        <ds-section-header
          [title]="'getInventory.locations.title' | t"
          [staticLabel]="locationRows().length.toString()"
        />

        @if (locationRows().length === 0) {
          <ds-empty-state
            icon="package"
            [title]="'getInventory.empty.title' | t"
            [text]="'getInventory.empty.text' | t"
          />
        }

        <ds-grid dsReveal="children" [minColumn]="'18.75rem'">
          @for (row of locationRows(); track row.location.id) {
            <ds-location-card
              [emoji]="row.emoji"
              [name]="row.name"
              [description]="row.description"
              [badges]="row.badges"
              (activated)="onOpen(row)"
            />
          }
        </ds-grid>
      </ds-stack>
    </ds-split-view>
  }

  <ds-confirm-action-modal
    [show]="showDiscardModal()"
    [title]="'getInventory.discardTitle' | t"
    [body]="'getInventory.discardBody' | t"
    [warningText]="'getInventory.discardWarning' | t"
    [isDeleting]="discarding()"
    [cancelLabel]="'getInventory.cancel' | t"
    [confirmLabel]="'getInventory.discardConfirm' | t"
    [deletingLabel]="'getInventory.discarding' | t"
    (confirmed)="onConfirmDiscard()"
    (cancelled)="onCancelDiscard()"
  />
</ds-page-wrapper>
