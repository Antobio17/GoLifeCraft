<ds-page-wrapper
  [maxWidth]="'40rem'"
  [wideMaxWidth]="'70rem'"
  [gap]="'var(--ds-space-5)'"
>
  <ds-screen-header
    [leading]="'back'"
    [leadingLabel]="'getInventories.back' | t"
    (leadingClick)="goBack()"
    [eyebrow]="'getInventories.eyebrow' | t"
    [title]="'getInventories.title' | t"
    [subtitle]="headerSubtitle()"
  >
    <ds-button
      slot="actions"
      data-testid="inventories-locations"
      variant="secondary"
      size="icon-lg"
      icon="aisles"
      [iconSize]="19"
      [ariaLabel]="'getInventories.locations' | t"
      (clicked)="onLocations()"
    />
    <ds-button
      slot="actions"
      data-testid="inventories-create"
      variant="primary"
      size="icon-lg"
      icon="plus"
      [iconSize]="19"
      [ariaLabel]="'getInventories.new' | t"
      (clicked)="onStart()"
    />
  </ds-screen-header>

  @if (loading()) {
    <ng-container
      [ngTemplateOutlet]="inventorySkeleton"
      [ngTemplateOutletContext]="{ $implicit: 4 }"
    />
  } @else if (months().length === 0) {
    <ds-empty-state
      icon="history"
      [title]="'getInventories.empty.title' | t"
      [text]="'getInventories.empty.text' | t"
    />
  } @else {
    @for (month of months(); track month.key) {
      <ds-stack [gap]="'var(--ds-space-2)'">
        <ds-section-header
          [title]="month.title"
          [staticLabel]="month.countLabel"
        />
        <ds-stack dsReveal="children" [gap]="'var(--ds-space-2)'">
          @for (row of month.rows; track row.id) {
            <ds-dated-row
              data-testid="inventory-row"
              [interactive]="true"
              [ariaLabel]="row.ariaLabel"
              [weekday]="row.weekday"
              [day]="row.day"
              [title]="row.title"
              [tag]="row.tag"
              [tagTone]="row.tagTone"
              [meta]="row.meta"
              [progress]="row.progress"
              (activated)="onOpen(row.id)"
            />
          }
        </ds-stack>
      </ds-stack>
    }

    @if (loadingMore()) {
      <ng-container
        [ngTemplateOutlet]="inventorySkeleton"
        [ngTemplateOutletContext]="{ $implicit: 2 }"
      />
    }

    <ds-infinite-scroll
      [disabled]="loadingMore() || !hasMore()"
      (reached)="loadMore()"
    />
  }
</ds-page-wrapper>

<ds-modal-sheet
  data-testid="inventory-start-sheet"
  [open]="startOpen()"
  [title]="'startInventory.title' | t"
  [caption]="startForm.scopeLabel()"
  [closeLabel]="'startInventory.close' | t"
  [confirmLabel]="'startInventory.save' | t"
  [confirmDisabled]="!startForm.canSubmit()"
  (confirmed)="startForm.submit()"
  (closed)="onCloseStart()"
>
  <app-start-inventory-form
    #startForm
    [active]="startOpen()"
    (started)="onStarted($event)"
  />
</ds-modal-sheet>

<ng-template #inventorySkeleton let-count>
  <ds-skeleton-list
    [count]="count"
    [gap]="'var(--ds-space-2)'"
    radius="var(--ds-radius-surface)"
    padding="var(--ds-space-3)"
    [tile]="50"
    titleWidth="52%"
    metaWidth="60%"
    [progress]="true"
  />
</ng-template>
