<ds-page-wrapper
  [maxWidth]="'40rem'"
  [wideMaxWidth]="'70rem'"
  [gap]="'var(--ds-space-5)'"
>
  <ds-screen-header
    [leading]="'back'"
    [leadingLabel]="'getTickets.back' | t"
    (leadingClick)="goBack()"
    [eyebrow]="'getTickets.eyebrow' | t"
    [title]="'getTickets.title' | t"
    [subtitle]="headerSubtitle()"
  >
    <ds-button
      slot="actions"
      data-testid="tickets-scan"
      variant="primary"
      size="icon-lg"
      icon="camera"
      [iconSize]="19"
      [ariaLabel]="'getTickets.scan' | t"
      (clicked)="onScan()"
    />
  </ds-screen-header>

  @if (loading()) {
    <ds-skeleton-filters [search]="true" [viewSwitch]="true" />
    <ng-container
      [ngTemplateOutlet]="ticketSkeleton"
      [ngTemplateOutletContext]="{ $implicit: 4 }"
    />
  } @else {
    <ds-stack [gap]="'var(--ds-space-3)'">
      <ds-search-input
        data-testid="tickets-search"
        [placeholder]="'getTickets.filter.search' | t"
        [clearLabel]="'getTickets.filter.clear' | t"
        [debounce]="300"
        [value]="search()"
        (searched)="onSearch($event)"
      />

      <ds-view-switch
        data-testid="tickets-status"
        [options]="statusOptions()"
        [ariaLabel]="'getTickets.filter.label' | t"
        [ngModel]="selectedStatus()"
        (ngModelChange)="onStatusChange($event)"
      />
    </ds-stack>

    @if (reloading()) {
      <ng-container
        [ngTemplateOutlet]="ticketSkeleton"
        [ngTemplateOutletContext]="{ $implicit: 4 }"
      />
    } @else if (months().length === 0) {
      @if (filtered()) {
        <ds-text variant="muted">
          {{ "getTickets.noResultsFilters" | t }}
        </ds-text>
      } @else {
        <ds-empty-state
          icon="cart"
          [title]="'getTickets.empty.title' | t"
          [text]="'getTickets.empty.text' | t"
        />
      }
    } @else {
      @for (month of months(); track month.key) {
        <ds-stack [gap]="'var(--ds-space-2)'">
          <ds-section-header
            [title]="month.title"
            [staticLabel]="month.countLabel"
          />
          <ds-stack dsReveal="children" [gap]="'var(--ds-space-2)'">
            @for (row of month.rows; track row.id) {
              <ds-dated-row
                data-testid="ticket-row"
                [interactive]="true"
                [ariaLabel]="row.ariaLabel"
                [weekday]="row.weekday"
                [day]="row.day"
                [title]="row.title"
                [tag]="row.tag"
                [tagTone]="row.tagTone"
                [meta]="row.meta"
                [value]="row.value"
                [progress]="row.progress"
                (activated)="onOpen(row.id)"
              />
            }
          </ds-stack>
        </ds-stack>
      }

      @if (loadingMore()) {
        <ng-container
          [ngTemplateOutlet]="ticketSkeleton"
          [ngTemplateOutletContext]="{ $implicit: 2 }"
        />
      }

      <ds-infinite-scroll
        [disabled]="loadingMore() || !hasMore()"
        (reached)="loadMore()"
      />
    }
  }
</ds-page-wrapper>

<ng-template #ticketSkeleton let-count>
  <ds-skeleton-list
    [count]="count"
    [gap]="'var(--ds-space-2)'"
    radius="var(--ds-radius-surface)"
    padding="var(--ds-space-3)"
    [tile]="50"
    titleWidth="52%"
    metaWidth="60%"
    [progress]="true"
  />
</ng-template>
