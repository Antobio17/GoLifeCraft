<ds-page-wrapper [gap]="'var(--ds-space-3)'">
  <ds-screen-header
    [title]="'getRecipes.heading' | t"
    [subtitle]="headerSubtitle()"
  >
    @if (canWrite()) {
      <ds-button slot="actions" size="md" icon="plus" (clicked)="onCreate()">
        {{ "getRecipes.create" | t }}
      </ds-button>
    }
  </ds-screen-header>

  @if (loading()) {
    <ds-skeleton-filters [search]="true" [caption]="true" />
    <ds-skeleton-list
      [count]="6"
      [columns]="null"
      minColumn="20rem"
      [gap]="'var(--ds-space-3)'"
      radius="var(--ds-radius-xl)"
      padding="var(--ds-space-3)"
      [alignTop]="true"
      [tile]="58"
      [tileRadius]="14"
      titleWidth="52%"
      headTrailing="3.25rem"
      metaWidth="42%"
      [chips]="3"
    />
  } @else if (items().length === 0) {
    <ds-empty-state
      icon="leaf"
      [title]="'getRecipes.empty.title' | t"
      [text]="'getRecipes.empty.text' | t"
    />
  } @else {
    <ds-search-input
      [placeholder]="'getRecipes.searchPlaceholder' | t"
      [clearLabel]="'getRecipes.searchClear' | t"
      [value]="searchQuery()"
      (searched)="onSearch($event)"
    />

    <ds-text variant="label">{{ "getRecipes.perServing" | t }}</ds-text>

    @if (!hasResults()) {
      <ds-text variant="muted">
        {{ "getRecipes.noResults" | t }} “{{ searchQuery() }}”
      </ds-text>
    } @else {
      <ds-grid [minColumn]="'20rem'">
        @for (card of cards(); track card.id) {
          <ds-recipe-card
            [emoji]="card.emoji"
            [name]="card.name"
            [kcal]="card.kcal + ' ' + ('getRecipes.macro.kcal' | t)"
            [meta]="card.meta"
            [macros]="card.macros"
            [hasSubRecipe]="card.hasSubRecipe"
            [subRecipeLabel]="'getRecipes.subRecipeTag' | t"
            (activated)="onSelect(card.id)"
          />
        }
      </ds-grid>
    }
  }
</ds-page-wrapper>
