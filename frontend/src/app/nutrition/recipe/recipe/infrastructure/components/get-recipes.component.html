<ds-page-wrapper [gap]="'var(--ds-space-3)'">
  <ds-screen-header
    [leading]="'back'"
    [leadingLabel]="'getRecipes.back' | t"
    (leadingClick)="goBack()"
    [eyebrow]="'getRecipes.eyebrow' | t"
    [title]="'getRecipes.heading' | t"
    [subtitle]="headerSubtitle()"
  >
    <ds-button
      data-testid="recipes-create"
      slot="actions"
      variant="primary"
      size="icon-lg"
      icon="plus"
      [iconSize]="19"
      [ariaLabel]="'getRecipes.create' | t"
      (clicked)="onCreate()"
    />
  </ds-screen-header>

  @if (loading()) {
    <ds-skeleton-filters [search]="true" [caption]="true" />
    <ds-skeleton-list
      [count]="6"
      [columns]="null"
      minColumn="18.75rem"
      [gap]="'var(--ds-space-2)'"
      radius="var(--ds-radius-surface)"
      padding="var(--ds-space-2) var(--ds-space-3) var(--ds-space-2) var(--ds-space-2)"
      [tile]="44"
      titleWidth="56%"
      headTrailing="2.25rem"
      metaWidth="44%"
    />
  } @else if (items().length === 0) {
    <ds-empty-state
      data-testid="recipes-empty"
      icon="leaf"
      [title]="'getRecipes.empty.title' | t"
      [text]="'getRecipes.empty.text' | t"
    />
  } @else {
    <ds-search-input
      data-testid="recipes-search"
      [placeholder]="'getRecipes.searchPlaceholder' | t"
      [clearLabel]="'getRecipes.searchClear' | t"
      [value]="searchQuery()"
      (searched)="onSearch($event)"
    />

    <ds-text variant="label">{{ "getRecipes.perServing" | t }}</ds-text>

    @if (!hasResults()) {
      <ds-text variant="muted">
        {{ "getRecipes.noResults" | t }} “{{ searchQuery() }}”
      </ds-text>
    } @else {
      <ds-grid
        dsReveal="children"
        [minColumn]="'18.75rem'"
        [gap]="'var(--ds-space-2)'"
      >
        @for (card of cards(); track card.id) {
          <ds-product-card
            data-testid="recipe-card"
            [attr.data-id]="card.id"
            [compact]="true"
            [emoji]="card.emoji"
            [imageUrl]="card.imageUrl"
            [name]="card.name"
            [meta]="card.rowMeta"
            [kcal]="card.kcal"
            [kcalUnit]="'getRecipes.macro.kcal' | t"
            [proteinG]="card.proteinG"
            [fatG]="card.fatG"
            [carbsG]="card.carbsG"
            [macroLabel]="card.macroAria"
            [macroLetters]="macroLabels()"
            (activated)="onSelect(card.id)"
          />
        }
      </ds-grid>
    }
  }
</ds-page-wrapper>
