<ds-stack dsReveal [gap]="'var(--ds-space-2)'">
  <ds-section-header
    [title]="'dashboard.agenda.title' | t"
    [actionLabel]="'dashboard.agenda.seeAll' | t"
    (action)="seeAll.emit()"
  />

  @if (loading()) {
    <ds-module-card>
      <ds-stack [gap]="'var(--ds-space-3)'">
        <ds-skeleton-line width="45%" height="0.75rem" />
        <ds-skeleton-line width="85%" height="1rem" />
        <ds-skeleton-line width="70%" height="1rem" />
      </ds-stack>
    </ds-module-card>
  } @else if (!hasEntries()) {
    <ds-cta-row
      icon="calendar"
      [dashed]="true"
      [title]="'dashboard.agenda.emptyTitle' | t"
      [subtitle]="'dashboard.agenda.empty' | t"
      (clicked)="seeAll.emit()"
    />
  } @else {
    <ds-module-card
      [eyebrow]="
        pendingCount() === 0
          ? ('dashboard.agenda.allDone' | t)
          : pendingCount() === 1
            ? ('dashboard.agenda.pendingOne' | t)
            : ('dashboard.agenda.pendingMany' | t: { count: pendingCount() })
      "
    >
      <ds-stack [gap]="'var(--ds-space-1)'">
        @for (entry of visibleEntries(); track entry.id) {
          <ds-link-row
            [title]="entry.title"
            [glyph]="entryGlyph(entry)"
            [icon]="entry.appointment ? 'clock' : 'check'"
            [meta]="
              entry.timeLabel ??
              entryWhenLabel(
                entry.entry,
                'dashboard.agenda.day.today' | t,
                'dashboard.agenda.day.tomorrow' | t
              )
            "
            [done]="entry.done"
            (clicked)="seeAll.emit()"
          />
        }
      </ds-stack>

      @if (hiddenCount() > 0) {
        <ds-text variant="meta">{{
          "dashboard.agenda.more" | t: { count: hiddenCount() }
        }}</ds-text>
      }
    </ds-module-card>
  }
</ds-stack>
