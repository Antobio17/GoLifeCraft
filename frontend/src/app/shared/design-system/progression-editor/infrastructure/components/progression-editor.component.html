<ds-stack [gap]="'var(--ds-space-3)'">
  <ds-select
    variant="soft"
    [fluid]="true"
    [options]="modeOptions"
    [ngModel]="mode"
    (ngModelChange)="modeChange.emit($event)"
    [ariaLabel]="modeLabel"
  />

  @if (configured) {
    <ds-text variant="meta">{{ modeHint }}</ds-text>

    @if (targets.length === 0) {
      <ds-text variant="meta">{{ noTargetsText }}</ds-text>
    } @else {
      <div class="pe-tbl">
        <div class="pe-tbl__head">
          <span class="pe-tbl__cell pe-tbl__cell--set">{{ setLabel }}</span>
          <span class="pe-tbl__cell">{{ nowLabel }}</span>
          <span class="pe-tbl__cell">{{ targetLabel }}</span>
        </div>

        @for (row of targets; track row.index) {
          <div class="pe-tbl__row">
            <span class="pe-tbl__cell pe-tbl__cell--set">{{ row.label }}</span>
            <span class="pe-tbl__cell pe-tbl__now">{{ row.now }}</span>
            <div class="pe-tbl__cell">
              <ds-number-input
                variant="boxed"
                [stepper]="false"
                [step]="1"
                [min]="1"
                [ngModel]="row.reps"
                (ngModelChange)="onTargetChange(row, $event)"
                [ariaLabel]="targetLabel + ' ' + row.label"
              />
            </div>
          </div>
        }
      </div>
    }

    <div class="pe-pair">
      <div class="pe-pair__item">
        <ds-text variant="meta">{{ toleranceLabel }}</ds-text>
        <ds-number-input
          variant="boxed"
          [stepper]="true"
          [step]="1"
          [min]="0"
          [ngModel]="tolerance"
          (ngModelChange)="toleranceChange.emit($event)"
          [ariaLabel]="toleranceLabel"
        />
      </div>
      <div class="pe-pair__item">
        <ds-text variant="meta">{{ incrementLabel }}</ds-text>
        <ds-number-input
          variant="boxed"
          [stepper]="true"
          [step]="0.25"
          [precision]="2"
          [min]="0.25"
          [ngModel]="increment"
          (ngModelChange)="incrementChange.emit($event)"
          [ariaLabel]="incrementLabel"
        />
      </div>
    </div>
  }
</ds-stack>
