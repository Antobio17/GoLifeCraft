<section
  class="active-banner"
  [class.active-banner--paused]="paused"
  [attr.aria-label]="stateLabel"
>
  <div class="active-banner__info">
    @if (restSwapped) {
      <span
        class="active-banner__time active-banner__time--rest active-banner__swap"
        [class.active-banner__time--long]="restLabel.length > 5"
        [class.active-banner__time--over]="restOverTarget"
        role="status"
        [attr.aria-label]="restCaption + ' ' + restLabel"
      >
        <ds-icon name="stopwatch" [size]="22" [stroke]="2.4" />
        {{ restLabel }}
      </span>
      <span class="active-banner__elapsed active-banner__swap">{{
        elapsedLabel
      }}</span>
    } @else {
      <span
        class="active-banner__time"
        [class.active-banner__time--long]="elapsedLabel.length > 5"
        >{{ elapsedLabel }}</span
      >
      @if (restVisible) {
        <span
          class="active-banner__rest"
          [class.active-banner__rest--over]="restOverTarget"
          [style.--rest-progress.%]="restProgress"
          role="status"
          [attr.aria-label]="restCaption + ' ' + restLabel"
        >
          <ds-icon name="stopwatch" [size]="12" [stroke]="2.4" />
          {{ restLabel }}
        </span>
      }
    }
  </div>

  <span
    class="active-banner__count"
    role="img"
    [attr.aria-label]="doneCount + '/' + totalSets + ' ' + setsLabel"
  >
    <svg class="active-banner__ring" viewBox="0 0 64 64" aria-hidden="true">
      <circle class="active-banner__ring-track" cx="32" cy="32" r="28" />
      <circle
        class="active-banner__ring-fill"
        cx="32"
        cy="32"
        r="28"
        [attr.stroke-dasharray]="ringDash"
      />
    </svg>
    <span class="active-banner__count-value" aria-hidden="true"
      >{{ doneCount
      }}<span class="active-banner__count-total">/{{ totalSets }}</span></span
    >
  </span>

  <span class="active-banner__actions">
    <button
      type="button"
      class="active-banner__btn active-banner__btn--finish"
      [disabled]="finishing"
      [attr.aria-label]="finishAriaLabel"
      [attr.title]="finishLabel"
      (click)="finished.emit()"
    >
      <ds-icon name="check" [size]="14" [stroke]="3" />
    </button>
    <button
      type="button"
      class="active-banner__btn"
      [attr.aria-label]="pauseAriaLabel"
      [attr.title]="paused ? resumeLabel : pauseLabel"
      (click)="pauseToggle.emit()"
    >
      <ds-icon [name]="paused ? 'play' : 'pause'" [size]="14" />
    </button>
    <button
      type="button"
      class="active-banner__btn active-banner__btn--stop"
      [attr.aria-label]="stopAriaLabel"
      [attr.title]="stopLabel"
      (click)="stopped.emit()"
    >
      <ds-icon name="square" [size]="11" />
    </button>
  </span>
</section>
