<ds-swipe-to-delete
  #swipe
  [reveal]="66"
  radius="var(--ds-radius-lg)"
  [removeLabel]="removeLabel"
  (remove)="remove.emit()"
>
  <ds-stack
    class="diary-entry__row"
    direction="row"
    align="center"
    gap="var(--ds-space-3)"
    [class.diary-entry__row--slid]="swipe.slid"
    [class.diary-entry__row--expanded]="expandable && expanded"
  >
    @if (pressable) {
      <ds-pressable [grow]="true" [ariaLabel]="pressLabel" (press)="onPress()">
        <ng-container [ngTemplateOutlet]="content" />
      </ds-pressable>
    } @else {
      <ng-container [ngTemplateOutlet]="content" />
    }

    <ds-inline-quantity
      [quantity]="quantity"
      [unit]="unitValue || unit"
      [unitLabel]="unit"
      [unitOptions]="unitOptions"
      [ariaLabel]="quantityAriaLabel"
      [unitAriaLabel]="unitAriaLabel"
      (quantityChange)="quantityChange.emit($event)"
      (unitChange)="unitChange.emit($event)"
    />
  </ds-stack>
</ds-swipe-to-delete>

<ng-template #content>
  <ds-emoji-tile [emoji]="emoji" [size]="38" [radius]="10" />

  <ds-stack gap="var(--ds-space-1)" [grow]="true">
    <ds-text variant="strong" class="diary-entry__name">{{ name }}</ds-text>
    <ds-stack
      direction="row"
      align="center"
      gap="var(--ds-space-1-5)"
      [wrap]="true"
    >
      <ds-chip [tone]="badgeTone">{{ badge }}</ds-chip>
      <ds-macro-badges [kcal]="kcalLabel" />
    </ds-stack>
    <ds-macro-badges [macros]="macros" />
  </ds-stack>
</ng-template>
