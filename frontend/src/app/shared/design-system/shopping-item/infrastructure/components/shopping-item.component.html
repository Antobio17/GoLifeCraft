<ds-swipe-to-delete
  pad="var(--ds-space-2)"
  #swipe
  [disabled]="!swipeable"
  [reveal]="66"
  [removeLabel]="removeLabel"
  (remove)="remove.emit()"
>
  <div
    class="shopping-item"
    [class.shopping-item--checked]="checked && dimChecked"
    [class.shopping-item--slid]="swipe.slid"
  >
    <button
      data-testid="shopping-item-toggle"
      type="button"
      class="shopping-item__check"
      [class.is-checked]="checked"
      [attr.aria-label]="toggleAriaLabel"
      [attr.aria-pressed]="checked"
      (click)="toggled.emit()"
    >
      @if (checked) {
        <ds-icon name="check" [size]="13" [stroke]="2.5" />
      }
    </button>

    <ds-emoji-tile
      [emoji]="emoji"
      [imageUrl]="imageUrl"
      [alt]="name"
      [size]="40"
    />

    <div class="shopping-item__body">
      @if (openable) {
        <ds-pressable
          class="shopping-item__open"
          [ariaLabel]="openLabel"
          (press)="opened.emit()"
        >
          <span class="shopping-item__name">{{ name }}</span>
        </ds-pressable>
      } @else {
        <span class="shopping-item__name">{{ name }}</span>
      }

      @if (meta) {
        <span class="shopping-item__meta">{{ meta }}</span>
      }

      @if (leftoverLabel && !checked) {
        <span class="shopping-item__leftover">{{ leftoverLabel }}</span>
      }
    </div>

    <div class="shopping-item__end">
      @if (priceLabel) {
        <span class="shopping-item__price">{{ priceLabel }}</span>
      }

      @if (!checked || !dimChecked) {
        <div class="shopping-item__stepper">
          <button
            data-testid="shopping-item-decrement"
            type="button"
            class="shopping-item__step"
            [disabled]="quantity <= 1"
            [attr.aria-label]="decrementLabel"
            (click)="decrement.emit()"
          >
            <ds-icon name="minus" [size]="13" [stroke]="2.6" />
          </button>
          <span
            data-testid="shopping-item-quantity"
            class="shopping-item__qty"
            >{{ quantity }}</span
          >
          <button
            data-testid="shopping-item-increment"
            type="button"
            class="shopping-item__step"
            [attr.aria-label]="incrementLabel"
            (click)="increment.emit()"
          >
            <ds-icon name="plus" [size]="13" [stroke]="2.6" />
          </button>
        </div>
      }
    </div>
  </div>
</ds-swipe-to-delete>
