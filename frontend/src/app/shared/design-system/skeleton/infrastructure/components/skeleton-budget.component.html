<div class="skbud">
  <div class="skbud__head">
    <span class="ds-sk skbud__eyebrow"></span>
    <span class="ds-sk skbud__chip"></span>
  </div>

  <div class="skbud__amount">
    <span class="ds-sk skbud__value"></span>
    <span class="ds-sk skbud__total"></span>
  </div>

  <span class="ds-sk skbud__meter" [style.height]="meterHeight"></span>

  <div class="skbud__foot">
    <span class="ds-sk skbud__pace"></span>
    <span class="ds-sk skbud__difference"></span>
  </div>
</div>
