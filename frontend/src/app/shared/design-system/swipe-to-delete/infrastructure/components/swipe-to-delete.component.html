<div
  class="swipe"
  [class.swipe--floating]="floating"
  [class.swipe--compact]="compact()"
  [style.--swipe-offset.px]="offset"
  [style.--ds-pad]="pad"
  [style.border-radius]="radius"
>
  @if (!disabled) {
    <button
      type="button"
      class="swipe__delete"
      [class.swipe__delete--revealed]="slid"
      [style.width]="compact() ? '2.5rem' : deleteWidth"
      [style.transition]="compact() ? transition : null"
      [attr.aria-label]="removeLabel"
      (pointerup)="onDeletePointerUp($event)"
      (touchend)="onDeleteTouchEnd($event)"
      (click)="onDeleteClick($event)"
    >
      <ds-icon name="trash" [size]="17" />
    </button>
  }

  <div
    class="swipe__surface"
    [class.swipe__surface--slid]="slid"
    [style.transform]="transform"
    [style.transition]="transition"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp()"
    (pointercancel)="onPointerUp()"
  >
    <ng-content />
  </div>
</div>
