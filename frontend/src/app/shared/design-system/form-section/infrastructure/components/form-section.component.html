@let section = sectionConfig();

<div
  class="form-section"
  [class.form-section--headerless]="
    !section.title && !section.icon && !section.iconName
  "
>
  @if (section.title || section.icon || section.iconName) {
    <div
      class="section-header"
      [class.collapsible]="section.collapsible"
      [attr.role]="section.collapsible ? 'button' : null"
      [attr.tabindex]="section.collapsible ? 0 : null"
      (click)="toggleCollapse()"
      (keydown.enter)="toggleCollapse()"
    >
      <h4 class="section-title">
        @if (section.iconName) {
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <use
              [attr.href]="
                'assets/icons/golifecraft/sprite.svg#i-' + section.iconName
              "
            ></use>
          </svg>
        } @else if (section.icon; as icon) {
          <svg
            [attr.width]="icon.width"
            [attr.height]="icon.height"
            [attr.viewBox]="icon.viewBox"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            @for (path of icon.paths; track path) {
              <path [attr.d]="path" />
            }
          </svg>
        }
        {{ section.title }}
      </h4>

      @if (section.collapsible) {
        <svg
          class="collapse-icon"
          [class.collapsed]="isCollapsed()"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <use href="assets/icons/golifecraft/sprite.svg#i-chevron-down"></use>
        </svg>
      }
    </div>
  }

  <div class="section-content" [class.collapsed]="isCollapsed()">
    <ng-content></ng-content>
  </div>
</div>
