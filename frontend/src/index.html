<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>GoLifeCraft</title>
    <base href="/" />
    <link
      rel="icon"
      type="image/x-icon"
      href="assets/img/favicon.ico"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="assets/img/favicon-dark.ico"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="assets/img/favicon-dark.ico"
    />
    <link rel="apple-touch-icon" href="assets/img/icon-dark.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="GoLifeCraft" />
    <script>
      (function () {
        var theme =
          localStorage.getItem("app-theme") === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#000000" : "#ffffff");
      })();
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      as="style"
      onload="this.rel = 'stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        color-scheme: dark;
        background-color: #000000;
      }

      html[data-theme="light"] {
        color-scheme: light;
        background-color: #ffffff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(
          --font-family-base,
          "Hanken Grotesk",
          system-ui,
          sans-serif
        );
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: clip;
        letter-spacing: -0.01em;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background-color: #000000;
        transition: opacity 260ms cubic-bezier(0.4, 0, 1, 1);
      }

      html[data-theme="light"] #app-splash {
        background-color: #ffffff;
      }

      #app-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      .app-splash__icon {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        background: url("assets/img/icon-dark.png") center / cover no-repeat;
        animation: app-splash-pulse 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      html[data-theme="light"] .app-splash__icon {
        background-image: url("assets/img/icon-light.png");
      }

      @keyframes app-splash-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.94);
          opacity: 0.72;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash {
          transition: none;
        }

        .app-splash__icon {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <app-main></app-main>
    <div id="app-splash" role="progressbar" aria-label="GoLifeCraft">
      <div class="app-splash__icon"></div>
    </div>
  </body>
</html>
