services:
  # frontend:
  #   container_name: golifecraft_frontend
  #   restart: always
  #   build:
  #     context: .
  #     dockerfile: infrastructure/docker/local/angular/Dockerfile
  #   ports:
  #     - 4201:4200
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   environment:
  #     - CHOKIDAR_USEPOLLING=true
  #   depends_on:
  #     - nginx

  nginx:
    container_name: golifecraft_nginx
    restart: always
    build:
      context: .
      dockerfile: infrastructure/docker/local/nginx/Dockerfile
    volumes:
      - ./backend/public/upload/:/var/www/upload/
    ports:
      - 8083:80
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  php:
    container_name: golifecraft_php
    restart: always
    build:
      context: .
      dockerfile: infrastructure/docker/local/php/Dockerfile
    env_file:
      - .env.local
    volumes:
      - ./backend:/var/www/html/
      - ./backend/vendor:/var/www/html/vendor:delegated
    links:
      - nginx:golifecraft_nginx
      - db:golifecraft_mysql
      - mailpit:golifecraft_mailpit
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.50'
          memory: 256M

  cron:
    container_name: golifecraft_cron
    restart: always
    build:
      context: .
      dockerfile: infrastructure/docker/local/php/Dockerfile
    command: ["cron", "-f"]
    volumes:
      - ./backend:/var/www/html/
      - ./backend/vendor:/var/www/html/vendor:delegated
    links:
      - db:golifecraft_mysql
      - mailpit:golifecraft_mailpit
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 128M

  loki:
    container_name: golifecraft_loki
    image: grafana/loki:3.7.6
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infrastructure/docker/local/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
        reservations:
          cpus: '0.10'
          memory: 128M

  dockerproxy:
    container_name: golifecraft_dockerproxy
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: always
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0
      EXEC: 0
      IMAGES: 0
      NETWORKS: 1
      VOLUMES: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      NODES: 0
      SWARM: 0
      SYSTEM: 0
      INFO: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      DISTRIBUTION: 0
      PLUGINS: 0
      SESSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.10'
          memory: 32M

  alloy:
    container_name: golifecraft_alloy
    image: grafana/alloy:v1.18.1
    restart: always
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infrastructure/docker/local/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
      - dockerproxy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          cpus: '0.10'
          memory: 64M

  grafana:
    container_name: golifecraft_grafana
    image: grafana/grafana:13.1.3
    restart: always
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-golifecraft-local}"
      GF_SERVER_ROOT_URL: http://localhost:3001/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/docker/local/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  mailpit:
    container_name: golifecraft_mailpit
    image: axllent/mailpit:latest
    restart: always
    ports:
      - "8026:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M

  db:
    container_name: golifecraft_mysql
    restart: always
    build:
      context: .
      dockerfile: infrastructure/docker/local/mysql/Dockerfile
    environment:
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: ${DATABASE_MASTER_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_MASTER_NAME:-master}
    ports:
      - 3310:3306
    volumes:
      - /var/lib/golifecraft-mysql-docker:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.50'
          memory: 512M

volumes:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  default:
    name: golifecraft_network
    ipam:
      config:
        - subnet: 172.43.0.0/16
